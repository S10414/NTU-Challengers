<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revela</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#E6C7B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Revela">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./vendor/lenis.css">
<link rel="preload" href="./vendor/fraunces-600.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:"Fraunces";font-style:normal;font-weight:600;font-display:swap;src:url(./vendor/fraunces-600.woff2) format("woff2")}
  :root{
    /* 黃昏：上方霧桃粉 → 中間米白的霧 → 地平線 → 褪色的枯草 */
    --sky:#E6C7B8; --haze:#F2E4D6; --horizon:#E2CFBD; --field:#D4BB9F;
    --dusk:linear-gradient(180deg,var(--sky) 0%,var(--haze) 46%,var(--horizon) 60%,var(--field) 100%);
    --card:#EAD8C8; --paper:#FAF3EA; --paper-2:#E8D9CB; --glass:rgba(250,243,234,.66);
    --ink:#2B211C; --ink-2:#56443A; --ink-3:#6A584C; --dark:#2B221D;
    --safe:#A84A33; --line:rgba(43,33,28,.16);
    --word:"Fraunces","Noto Serif TC",Georgia,serif;
    --serif:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{background:var(--card)}
  body{background:var(--dusk) fixed}
  html,body{margin:0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  img{display:block}

  /* 視覺層：底片質感背景、安全燈、顯影照片 */
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s ease}
  #bg.on{opacity:1}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .fx-photo{display:block;opacity:0;max-width:100%}
  .fx-safe{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

  #app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  header.top{display:flex;align-items:baseline;justify-content:space-between;padding:max(22px,env(safe-area-inset-top)) 22px 10px}
  header.top h1{font-family:var(--word);font-weight:600;font-size:25px;letter-spacing:.005em;margin:0}
  header.top .date{font-size:13px;color:var(--ink-2)}
  main{flex:1;padding:6px 22px 110px}

  nav.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;
    display:flex;background:rgba(246,234,222,.72);-webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);border-top:1px solid var(--line);
    padding:8px 10px max(14px,env(safe-area-inset-bottom))}
  nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 14px;font-size:14px;color:var(--ink-3);position:relative;letter-spacing:.04em}
  nav.tabs button.on{color:var(--ink)}
  #navdot{position:absolute;left:0;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 6px);width:4px;height:4px;border-radius:50%;background:var(--ink);pointer-events:none}

  .paper{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:14px 16px;border-radius:4px;box-shadow:0 1px 0 rgba(43,33,28,.10),0 0 0 1px rgba(255,255,255,.35) inset;margin-bottom:10px}
  .muted{color:var(--ink-2)} .small{font-size:13px}
  p.lead{font-family:var(--serif);font-size:17px;line-height:1.85;margin:6px 0 14px}

  .btn{display:inline-block;padding:11px 16px;border:1px solid var(--ink);background:transparent;border-radius:2px;font-size:15px;line-height:1;text-align:center}
  .btn.fill{background:var(--ink);color:var(--paper)}
  .btn.wide{width:100%;padding:14px 16px}
  .btn:disabled{opacity:.45;cursor:default}
  .link{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:13px}

  .notice{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-left:2px solid var(--safe);padding:12px 14px;margin:0 0 14px;font-size:14px;line-height:1.7;color:var(--ink-2)}
  .notice .btn{margin-top:10px;padding:9px 14px;font-size:14px}

  .moment{border-radius:3px;margin:8px 0 18px;text-align:left;width:100%;border:0}
  .moment.wait{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:16px}
  .moment.wait .t{font-family:var(--serif);font-size:18px;margin:0 0 4px}
  .moment.now{background:var(--safe);color:var(--paper);padding:26px 18px 22px;box-shadow:0 8px 24px rgba(120,52,32,.28)}
  .moment.now .t{font-family:var(--serif);font-size:30px;letter-spacing:.06em;margin:0 0 6px;font-weight:600}
  .moment.now .s{font-size:14px;opacity:.9}
  .moment.done{background:rgba(232,217,203,.7);padding:14px 16px;color:var(--ink-2);font-family:var(--serif);font-size:16px}
  .row{display:flex;gap:10px;align-items:center;margin:0 0 18px}
  .entry{display:flex;gap:12px;align-items:flex-start}
  .entry .th{width:64px;height:64px;flex:none;background:var(--paper-2);border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .entry .th img{width:100%;height:100%;object-fit:cover}
  .entry .line{font-family:var(--serif);font-size:16px;line-height:1.6;margin:0 0 4px}
  .entry .meta{font-size:12px;color:var(--ink-3)}
  .entry button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;width:100%}
  .empty{font-family:var(--serif);color:var(--ink-2);font-size:16px;line-height:1.8;padding:10px 0}

  /* 這週：拍貼機。一天一條四格，左右換天、上下換週 */
  main.v-week{padding-bottom:0}
  .weekhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 10px}
  .weekhead .rng{font-family:var(--serif);font-size:19px;letter-spacing:.02em}
  .weekhead .hint{font-size:12px;color:var(--ink-2);margin-top:3px}
  .weekhead .btn{padding:9px 13px;font-size:14px;flex:none}
  .wdays{display:flex;justify-content:space-between;margin:0 0 4px}
  .wdays button{flex:1;background:none;border:0;padding:6px 0 8px;font-family:var(--serif);font-size:14px;color:var(--ink-2);position:relative}
  .wdays button.on{color:var(--ink);font-weight:600}
  .wdays button.on::after{content:"";position:absolute;left:50%;bottom:2px;width:14px;height:2px;margin-left:-7px;background:var(--ink)}
  .wdays button.td{color:#8E3B27}
  .booth{margin:0 -22px;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .booth::-webkit-scrollbar,.wtrack::-webkit-scrollbar{display:none}
  .wrow{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative}
  .wrow .wk{position:absolute;left:22px;top:6px;font-size:11px;letter-spacing:.06em;color:var(--ink-3)}
  .wtrack{height:100%;display:flex;align-items:center;gap:var(--gap,16px);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
    overscroll-behavior-x:contain;scrollbar-width:none;padding:0 calc(50% - var(--sw,190px) / 2)}
  .strip{flex:none;width:var(--sw,190px);scroll-snap-align:center;scroll-snap-stop:always;background:var(--paper);padding:10px 10px 0;
    box-shadow:0 1px 0 rgba(90,60,40,.18),0 10px 26px rgba(90,60,40,.18);display:flex;flex-direction:column;gap:6px;transition:opacity .3s}
  .strip.future{opacity:.42}
  .frame{touch-action:manipulation;-webkit-tap-highlight-color:transparent;width:var(--fw,170px);height:var(--fh,140px);background:var(--dark);border:0;padding:0;overflow:hidden;position:relative;display:block}
  .frame img{width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(1.02)}
  .frame.empty{background:var(--paper-2);cursor:default}
  .frame.empty span{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--ink-3);letter-spacing:.04em}
  .frame.txt{background:var(--dark);color:var(--paper);font-family:var(--serif);font-size:13px;line-height:1.5;text-align:left;padding:10px;display:flex;align-items:flex-end}
  .frame .n{position:absolute;right:6px;top:6px;background:rgba(250,243,234,.92);color:var(--ink);font-size:11px;padding:1px 6px;border-radius:999px}
  .strip .foot{height:34px;display:flex;align-items:center;justify-content:space-between;font-family:var(--serif);font-size:12px;color:var(--ink-2)}
  .strip .foot b{font-family:var(--word);font-weight:600;font-size:13px;letter-spacing:.01em;color:var(--ink)}
  .strip.today .foot .d{color:var(--safe);font-weight:600}
  /* 滿版：從格子放大 */
  .ov.full{background:transparent;overflow:hidden}
  .ov.full .bd{position:absolute;inset:0;background:#120E0C}
  .ov.full .ph{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-out}
  .ov.full .ph.txt{display:flex;align-items:center;justify-content:center;padding:40px 32px;font-family:var(--serif);font-size:24px;line-height:1.8;color:var(--paper);background:var(--dark);overflow:hidden}
  .ov.full .fbar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:baseline;padding:max(20px,env(safe-area-inset-top)) 22px 40px;background:linear-gradient(rgba(0,0,0,.55),transparent);color:var(--paper);pointer-events:none}
  .ov.full .fbar>*{pointer-events:auto}
  .ov.full .fbar .t{font-family:var(--serif);letter-spacing:.08em;font-size:16px}
  .ov.full .link{color:var(--paper);opacity:.9}
  .ov.full .info{position:absolute;left:0;right:0;bottom:0;padding:56px 22px max(24px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7));color:var(--paper)}
  .ov.full .info .line{font-family:var(--serif);font-size:20px;line-height:1.6;margin:0 0 6px}
  .ov.full .info .meta{font-size:13px;opacity:.8;margin-bottom:14px}
  .ov.full .sibs{margin:0 0 14px}
  /* 存下來 */
  .ov.save{background:var(--ink);color:var(--paper)}
  .ov.save .link{color:var(--paper);opacity:.85}
  .ov.save h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0}
  .seg{display:flex;gap:8px;margin:18px 0 16px}
  .seg button{flex:1;background:transparent;border:1px solid rgba(250,243,234,.45);color:var(--paper);border-radius:999px;padding:9px 4px;font-size:14px}
  .seg button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .expv{display:flex;justify-content:center;margin:0 0 16px}
  .expv .pv{height:min(58vh,560px);aspect-ratio:9/16;background:var(--dark);display:flex;align-items:center;justify-content:center;color:rgba(250,243,234,.6);font-family:var(--serif);font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .expv img{height:100%;width:100%;object-fit:contain;display:block}
  .ov.save .btn.paper{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .ov.save .note{font-size:12px;opacity:.65;margin-top:10px;text-align:center;line-height:1.6}
  .weekhead .acts{display:flex;gap:8px;flex:none}
  .sibs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-12px 0 24px;font-size:13px;opacity:.85}
  .sibs button{width:44px;height:44px;padding:0;border:2px solid transparent;background:#000;overflow:hidden}
  .sibs button.on{border-color:var(--paper)}
  .sibs img{width:100%;height:100%;object-fit:cover}

  .print{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:18px 18px 14px;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.05);margin-bottom:14px}
  .print .txt{font-family:var(--serif);font-size:18px;line-height:1.85;margin:0 0 10px}
  .print .when{font-size:12px;color:var(--ink-3);margin-bottom:12px}
  .print .fb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .print .fb .btn{padding:8px 12px;font-size:13px}
  .print .fb .chosen{font-size:13px;color:var(--ink-2)}
  .print textarea{width:100%;margin-top:10px;background:transparent;border:0;border-bottom:1px solid var(--ink-3);padding:6px 0;resize:none;font-family:var(--serif);font-size:15px;line-height:1.6}
  .print .reply{font-family:var(--serif);font-size:15px;color:var(--ink-2);margin-top:10px;padding-left:10px;border-left:2px solid var(--ink-3)}
  .agent-sec{margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}
  .agent-sec h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 6px}
  .agent-sec .lead{font-size:15px;color:var(--ink-2);margin:0 0 10px}
  .status{font-family:var(--serif);font-size:16px;line-height:1.8;color:var(--ink-2);margin:0 0 14px}

  .ov{position:fixed;inset:0;z-index:50;overflow:auto;display:none}
  .ov.show{display:block}
  .ov .in{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(22px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom))}
  .ov.cap{background:var(--safe);color:var(--paper)}
  .ov.cap .in{position:relative;z-index:1}
  .ov.cap .top{display:flex;justify-content:space-between;align-items:baseline}
  .ov.cap .top .link{color:var(--paper);opacity:.85}
  .ov.cap .now{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:.06em;margin:22px 0 0}
  .ov.cap .cd{font-family:var(--serif);font-size:56px;font-variant-numeric:tabular-nums;line-height:1;margin:6px 0 4px}
  .ov.cap .cd.late{opacity:.6}
  .ov.cap .latemsg{font-size:14px;opacity:.9;min-height:20px;margin-bottom:18px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}
  .chip{background:transparent;border:1px solid rgba(250,243,234,.7);color:var(--paper);border-radius:999px;padding:8px 14px;font-size:14px}
  .chip.on{background:var(--paper);color:var(--safe);border-color:var(--paper)}
  .camlab{display:block;border:1px solid rgba(250,243,234,.8);border-radius:2px;padding:16px;text-align:center;font-size:16px;cursor:pointer;margin-bottom:14px}
  .camlab input{position:absolute;width:1px;height:1px;opacity:0}
  .prev{background:rgba(0,0,0,.18);margin-bottom:14px;max-height:42vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .prev img{max-width:100%;max-height:42vh;object-fit:contain}
  .ov.cap input.line{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(250,243,234,.7);padding:10px 0;font-family:var(--serif);font-size:18px;color:var(--paper);margin-bottom:22px}
  .ov.cap input.line::placeholder{color:rgba(250,243,234,.55)}
  .ov.cap .btn.paper{background:var(--paper);color:var(--safe);border-color:var(--paper)}

  .ov.dark{background:var(--ink);color:var(--paper)}
  .ov.dark .link{color:var(--paper);opacity:.8}
  .ov.dark .big{margin:18px 0;padding:10px;display:flex;justify-content:center}
  .ov.dark .big .fx-photo,.ov.dark .big .fx-photo-fb{box-shadow:0 0 0 10px var(--paper)}
  .ov.dark .big img{width:100%;max-height:62vh;object-fit:contain;background:#000}
  .ov.dark .line{font-family:var(--serif);font-size:20px;line-height:1.7;margin:0 0 8px}
  .ov.dark .meta{font-size:13px;opacity:.7;margin-bottom:26px}

  .ov.slide{background:#000;color:var(--paper);cursor:pointer}
  .ov.slide .in{padding:0;justify-content:center;position:relative}
  .ov.slide img{width:100%;max-height:100dvh;object-fit:contain}
  .ov.slide .cap{position:absolute;left:0;right:0;bottom:0;padding:22px calc(22px + env(safe-area-inset-left)) max(22px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6))}
  .ov.slide .cap .line{font-family:var(--serif);font-size:20px;margin:0 0 4px}
  .ov.slide .cap .meta{font-size:13px;opacity:.75}
  .ov.slide .bar{position:absolute;top:0;left:0;height:2px;background:var(--paper);width:0;z-index:2}
  .ov.slide .stage{display:flex;align-items:center;justify-content:center;width:100%;height:100dvh}

  .ov.sheet2{background:var(--dusk)}
  .ov.sheet2 h2,#view.v-settings h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 4px}
  .ov.sheet2 .grp,#view.v-settings .grp{margin:26px 0 0}
  .ov.sheet2 .grp h3,#view.v-settings .grp h3{font-size:14px;color:var(--ink-2);font-weight:600;margin:0 0 8px}
  .ov.sheet2 .grp p,#view.v-settings .grp p{font-size:14px;line-height:1.75;color:var(--ink-2);margin:0 0 10px}
  .ov.sheet2 input[type=password],.ov.sheet2 input[type=text],.ov.sheet2 input[type=email],#view.v-settings input[type=password],#view.v-settings input[type=text],#view.v-settings input[type=email]{width:100%;background:var(--glass);border:1px solid var(--line);border-radius:2px;padding:11px 12px;font-size:15px;margin-bottom:10px}

  .bk .st{font-size:13px;color:var(--ink-2);line-height:1.7;margin:0 0 10px}
  .bk .err{color:#8E3B27}
  .bk .row2{display:flex;gap:8px;align-items:center}
  .bk .row2 input{flex:1;margin-bottom:0!important}
  .bk .row2 .btn{flex:none;padding:11px 14px}
  .onb h1{font-family:var(--word);font-size:56px;font-weight:600;letter-spacing:0;margin:60px 0 26px}
  .onb p{font-family:var(--serif);font-size:17px;line-height:1.9;margin:0 0 6px}
  .onb label{display:block;margin:38px 0 8px;font-size:13px;color:var(--ink-2)}
  .onb input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--ink);padding:10px 0;font-family:var(--serif);font-size:20px;margin-bottom:34px}

  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="app">
  <header class="top"><h1>Revela</h1><span class="date" id="hdate"></span></header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-act="nav" data-v="today">今天</button>
    <button data-act="nav" data-v="week">這週</button>
    <button data-act="nav" data-v="settings">設定</button>
    <i id="navdot" aria-hidden="true"></i>
  </nav>
</div>
<div class="ov cap" id="ovCap" data-lenis-prevent><div class="in" id="capBody"></div></div>
<div class="ov dark" id="ovEntry" data-lenis-prevent></div>
<div class="ov slide" id="ovSlide" data-lenis-prevent></div>
<div class="ov full" id="ovFull" data-lenis-prevent></div>
<div class="ov save" id="ovSave" data-lenis-prevent></div>

<script src="./vendor/gsap.min.js"></script>
<script src="./vendor/lenis.min.js"></script>
<script src="./fx.js"></script>
<script src="./supabase-config.js"></script>
<script src="./vendor/supabase.min.js"></script>
<script>
/* ---------- 基本 ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const WD=['日','一','二','三','四','五','六'];
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>`${d.getMonth()+1}月${d.getDate()}日 週${WD[d.getDay()]}`;
const fmtTime=ts=>{const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

const S={view:'today',entries:[],agentLog:[],agentMeta:{},settings:null,moment:null,cap:null,
         weekOff:0,dayIdx:null,busy:false,err:'',freshId:null,dayKey:dkey(new Date()),installEvt:null,notif:(window.Notification?Notification.permission:'unsupported')};
const THEMES=()=>[{k:'daily',n:'日常'},{k:'people',n:'身邊的人'},{k:'place',n:'所在之處'},{k:'habit',n:(S.settings&&S.settings.habit)||'習慣'}];
const themeName=k=>(THEMES().find(t=>t.k===k)||{}).n||k;

/* ---------- 視覺層（fx.js）。沒載入時退回最簡版本，App 照常可用 ---------- */

/* ---------- IndexedDB ---------- */
const DB='xianying';
let dbp=null;
function db(){
  if(dbp) return dbp;
  dbp=new Promise((res,rej)=>{
    const r=indexedDB.open(DB,2);
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains('entries')) d.createObjectStore('entries',{keyPath:'id'});
      if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');   // 原圖（Blob），key = entry id
    };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return dbp;
}
async function tx(store,mode,fn){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,mode), s=t.objectStore(store); let out;
    out=fn(s); t.oncomplete=()=>res(out&&'result' in out?out.result:out); t.onerror=()=>rej(t.error);
  });
}
const kvGet=async k=>{ try{ return await tx('kv','readonly',s=>s.get(k)) }catch{ return undefined } };
const kvSet=async (k,v)=>{ try{ await tx('kv','readwrite',s=>s.put(v,k)) }catch(e){ console.error('save failed',e) } };
const kvDel=async k=>{ try{ await tx('kv','readwrite',s=>s.delete(k)) }catch{} };
const allEntries=async()=>{ try{ return (await tx('entries','readonly',s=>s.getAll()))||[] }catch{ return [] } };
const putEntry=async e=>{ try{ await tx('entries','readwrite',s=>s.put(e)) }catch(err){ console.error('save failed',err); alert('存不進去，可能是空間不足。') } };
const delEntry=async id=>{ try{ await tx('entries','readwrite',s=>s.delete(id)) }catch{} };
const putPhoto=async(id,b)=>{ try{ await tx('photos','readwrite',s=>s.put(b,id)) }catch(err){ console.error('photo save failed',err) } };
const getPhoto=async id=>{ try{ return await tx('photos','readonly',s=>s.get(id)) }catch{ return undefined } };
const delPhoto=async id=>{ try{ await tx('photos','readwrite',s=>s.delete(id)) }catch{} };
const clearPhotos=async()=>{ try{ await tx('photos','readwrite',s=>s.clear()) }catch{} };
const clearEntries=async()=>{ try{ await tx('entries','readwrite',s=>s.clear()) }catch{} };

async function load(){
  S.settings=await kvGet('settings')||null;
  S.entries=(await allEntries()).sort((a,b)=>a.ts-b.ts);
  S.agentLog=await kvGet('agentLog')||[];
  S.agentMeta=await kvGet('agentMeta')||{};
  await ensureMoment();
}

/* ---------- 今天的時刻 ---------- */
async function ensureMoment(){
  const k='moment:'+dkey(new Date());
  let m=await kvGet(k);
  if(!m){
    const now=new Date(), start=new Date(now), end=new Date(now);
    start.setHours(9,0,0,0); end.setHours(22,0,0,0);
    let at=null;
    if(now<end){ const lo=Math.max(now.getTime()+90e3,start.getTime()); at=Math.round(lo+Math.random()*(end.getTime()-lo)); }
    m={at,notified:false}; await kvSet(k,m);
  }
  S.moment=m;
}
const momentDone=()=>{const t=dkey(new Date());return S.entries.some(e=>e.moment&&e.date===t)};

/* 開著或剛切到背景時，時刻到了就送通知 */
async function tickMoment(){
  const m=S.moment; if(!m||!m.at||m.notified) return;
  if(Date.now()<m.at) return;
  m.notified=true; await kvSet('moment:'+dkey(new Date()),m);
  if(momentDone()) return;
  if(window.Notification&&Notification.permission==='granted'){
    try{ const reg=await navigator.serviceWorker.ready; reg.active&&reg.active.postMessage({type:'moment',day:dkey(new Date())}); }catch(e){ console.error(e) }
  }
}

function entryRow(e){

function weekStart(off){ const d=new Date(); d.setHours(0,0,0,0); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd+off*7); return d }
const DAYC=['一','二','三','四','五','六','日'];
const todayIdx=()=>(new Date().getDay()+6)%7;
/* 最早要顯示到哪一週：開始使用那天或最早一則紀錄，最多往回兩年 */
function minWeekOff(){
  const cur=weekStart(0).getTime();
  let first=S.settings&&S.settings.since?parseD(S.settings.since).getTime():Date.now();
  if(S.entries.length) first=Math.min(first,S.entries[0].ts);
  const d=new Date(first); d.setHours(0,0,0,0); d.setDate(d.getDate()-(d.getDay()+6)%7);
  return Math.max(-104,Math.min(0,Math.round((d.getTime()-cur)/(7*864e5))));
}
function weekRange(off){ const s=weekStart(off), e=new Date(s); e.setDate(s.getDate()+6); return `${s.getMonth()+1}/${s.getDate()} – ${e.getMonth()+1}/${e.getDate()}` }
function weekHasImg(off){ const s=weekStart(off).getTime(), e=s+7*864e5; return S.entries.some(x=>x.img&&x.ts>=s&&x.ts<e) }
/* 一格：同一天同一主題有多張時，放那天的時刻那張，沒有就放最後一張 */
function frameHTML(k,t,full){
  const es=S.entries.filter(x=>x.date===k&&x.theme===t.k);
  if(!es.length) return `<div class="frame empty" aria-label="${esc(t.n)}：沒有"><span>${esc(t.n)}</span></div>`;
  const x=es.find(y=>y.moment)||es[es.length-1], n=es.length>1?`<i class="n">${es.length}</i>`:'';
  if(!x.img) return `<button class="frame txt" data-act="full" data-id="${x.id}" aria-label="${esc(t.n)}">${esc((x.line||t.n).slice(0,24))}${n}</button>`;
  return `<button class="frame" data-act="full" data-id="${x.id}" aria-label="${esc(t.n)}${x.line?'：'+esc(x.line):''}，放大">${full?`<img src="${x.img}" alt="" decoding="async">`:''}${n}</button>`;
}
function stripsHTML(off,full){
  const s=weekStart(off), today=dkey(new Date()), now=Date.now();
  return DAYC.map((c,i)=>{
    const d=new Date(s); d.setDate(s.getDate()+i); const k=dkey(d), fut=d.getTime()>now&&k!==today;
    const frames=THEMES().map(t=>fut?`<div class="frame empty"><span>${esc(t.n)}</span></div>`:frameHTML(k,t,full)).join('');
    return `<div class="strip ${k===today?'today':''} ${fut?'future':''}" data-i="${i}" aria-label="${d.getMonth()+1}月${d.getDate()}日 週${c}">
      ${frames}<div class="foot"><b>Revela</b><span class="d">${k===today?'今天':fut?'還沒到':`${d.getMonth()+1}.${pad(d.getDate())} ${c}`}</span></div></div>`;
  }).join('');
}
function viewWeek(){
  const min=minWeekOff();
  S.weekOff=Math.max(min,Math.min(0,S.weekOff));
  if(S.dayIdx==null) S.dayIdx=todayIdx();
  let rows='';
  for(let off=min;off<=0;off++){
    const full=Math.abs(off-S.weekOff)<=1;
    rows+=`<section class="wrow" data-off="${off}"><span class="wk">${off===0?'這週':weekRange(off)}</span><div class="wtrack" data-off="${off}" data-full="${full?1:0}">${stripsHTML(off,full)}</div></section>`;
  }
  return `<div class="weekhead"><div><div class="rng" id="wkRng">${weekRange(S.weekOff)}</div><div class="hint">左右換天・上下換週</div></div>
      <div class="acts"><button class="btn" data-act="play" id="wkPlay" ${weekHasImg(S.weekOff)?'':'disabled'}>播放</button><button class="btn fill" data-act="save">存下來</button></div></div>
    <div class="wdays" id="wdays">${DAYC.map((c,i)=>`<button data-act="wday" data-i="${i}" class="${i===S.dayIdx?'on':''} ${S.weekOff===0&&i===todayIdx()?'td':''}" aria-label="週${c}">${c}</button>`).join('')}</div>
    <div class="booth" id="booth" data-lenis-prevent tabindex="-1">${rows}</div>`;
}
/* 版面：拍貼機要剛好塞滿「標題下方到分頁列上方」，頁面本身不捲 */
let boothH=0, boothStep=206;
const smooth=()=>matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
function layoutBooth(){
  const b=$('#booth'); if(!b) return;
  const top=b.getBoundingClientRect().top+scrollY, tabs=$('#tabs').offsetHeight||70;
  const H=Math.max(380,Math.round(innerHeight-top-tabs));
  const W=b.clientWidth||innerWidth;
  // 一條：上 padding 10 + 四格 + 三個間距 6 + 底下 34；上下各留 30 給週標與呼吸
  let fh=Math.floor((H-60-10-18-34)/4), fw=Math.round(fh*1.22);
  const maxW=Math.min(230,W*0.58); if(fw>maxW){ fw=Math.round(maxW); fh=Math.round(fw/1.22) }
  const sw=fw+20, gap=Math.max(14,Math.round(W*0.045));
  boothH=H; boothStep=sw+gap;
  b.style.height=H+'px';
  b.style.setProperty('--fh',fh+'px'); b.style.setProperty('--fw',fw+'px');
  b.style.setProperty('--sw',sw+'px'); b.style.setProperty('--gap',gap+'px');
}
function placeBooth(){
  const b=$('#booth'); if(!b) return;
  const min=minWeekOff();
  b.scrollTop=(S.weekOff-min)*boothH;
  b.querySelectorAll('.wtrack').forEach(t=>{ t.scrollLeft=S.dayIdx*boothStep });
}
function hydrateWeeks(){
  const b=$('#booth'); if(!b) return;
  b.querySelectorAll('.wtrack').forEach(t=>{
    const off=Number(t.dataset.off), want=Math.abs(off-S.weekOff)<=1?'1':'0';
    if(t.dataset.full!==want){ const L=t.scrollLeft; t.innerHTML=stripsHTML(off,want==='1'); t.dataset.full=want; t.scrollLeft=L }
  });
}
function syncWeekHead(){
  const r=$('#wkRng'); if(r) r.textContent=weekRange(S.weekOff);
  const p=$('#wkPlay'); if(p) p.disabled=!weekHasImg(S.weekOff);
  document.querySelectorAll('#wdays button').forEach((x,i)=>{ x.classList.toggle('on',i===S.dayIdx); x.classList.toggle('td',S.weekOff===0&&i===todayIdx()) });
}
function mountBooth(){
  const b=$('#booth'); if(!b) return;
  layoutBooth(); placeBooth();
  /* iPhone：在會吸附捲動的容器裡，點一下常常不會產生 click（尤其剛滑完）。
     直接用觸控判斷「點一下」：手指移動小於 10px、0.7 秒內放開，就當作點擊並打開滿版，
     同時取消後續的 click，避免重複觸發。 */
  let tp=null;
  b.addEventListener('touchstart',ev=>{
    const f=ev.target.closest&&ev.target.closest('.frame[data-act="full"]'), t=ev.touches[0];
    tp=(f&&ev.touches.length===1)?{f,x:t.clientX,y:t.clientY,t:Date.now()}:null;
  },{passive:true});
  b.addEventListener('touchmove',ev=>{ if(!tp) return; const t=ev.touches[0]; if(Math.hypot(t.clientX-tp.x,t.clientY-tp.y)>10) tp=null },{passive:true});
  b.addEventListener('touchcancel',()=>{ tp=null },{passive:true});
  b.addEventListener('touchend',ev=>{
    const p=tp; tp=null; if(!p||Date.now()-p.t>700) return;
    if(ev.cancelable) ev.preventDefault();
    openFull(p.f.dataset.id,p.f);
  },{passive:false});
  let vt=null;
  // 上下：換週。停下來之後才換內容，滑的過程不重排
  b.addEventListener('scroll',ev=>{
    if(ev.target===b){
      const off=minWeekOff()+Math.round(b.scrollTop/boothH);
      if(off!==S.weekOff){
        S.weekOff=off; syncWeekHead();
        const row=b.querySelector(`.wtrack[data-off="${off}"]`); if(row) row.scrollLeft=S.dayIdx*boothStep;
      }
      clearTimeout(vt); vt=setTimeout(hydrateWeeks,140);
    }else if(ev.target.classList&&ev.target.classList.contains('wtrack')&&Number(ev.target.dataset.off)===S.weekOff){
      // 左右：換天
      const L=ev.target.scrollLeft, dx=L-(ev.target._lastL??L); ev.target._lastL=L; if(fx.flow) fx.flow(dx);
      const i=Math.max(0,Math.min(6,Math.round(L/boothStep)));
      if(i!==S.dayIdx){ S.dayIdx=i; syncWeekHead() }
    }
  },{capture:true,passive:true});
}
function goDay(i){
  i=Math.max(0,Math.min(6,i)); const t=document.querySelector(`#booth .wtrack[data-off="${S.weekOff}"]`);
  if(t) t.scrollTo({left:i*boothStep,behavior:smooth()});
}
function goWeek(dir){
  const b=$('#booth'); if(!b) return; const min=minWeekOff();
  const off=Math.max(min,Math.min(0,S.weekOff+dir)); b.scrollTo({top:(off-min)*boothH,behavior:smooth()});
}
function agentReady(){ const days=new Set(S.entries.map(e=>e.date)); return S.entries.length>=6&&days.size>=3 }
function rel(ts){ const h=(Date.now()-ts)/36e5; if(h<1)return'剛剛'; if(h<24)return`${Math.floor(h)} 小時前`; return`${Math.floor(h/24)} 天前` }
function agentSec(){
  const hasKey=agentCan();
  let status;
  if(S.busy) status='它在看。';
  else if(S.err) status=S.err;
  else if(!hasKey) status=bkOn()?'還在準備。連上網路之後它就開始看。':'它需要雲端備份開著才看得了。到設定重新開啟備份。';
  else if(!agentReady()) status='還在累積。它需要幾天的紀錄，才看得出什麼是反覆出現的。';
  else if(!S.agentMeta.lastCheck) status='還沒看過。';
  else status=`上次看是${rel(S.agentMeta.lastCheck)}。${S.agentMeta.lastSpoke?'':'那次沒有想說的。'}`;
  const prints=S.agentLog.slice().reverse().map(m=>`<div class="print"${m.id===S.freshId?' data-fresh':''}>
    <p class="txt">${esc(m.text)}</p>
    <div class="when">${new Date(m.ts).getMonth()+1}月${new Date(m.ts).getDate()}日</div>
    <div class="fb">${m.reaction?`<span class="chosen">你說：${m.reaction==='yes'?'有這回事':'不是這樣'}</span>`:
      `<button class="btn" data-act="react" data-id="${m.id}" data-r="yes">有這回事</button><button class="btn" data-act="react" data-id="${m.id}" data-r="no">不是這樣</button>`}</div>
    ${m.reply?`<div class="reply">${esc(m.reply)}</div>`:(m.reaction?`<textarea rows="1" placeholder="想補一句的話（可以不寫）" data-reply="${m.id}"></textarea><div style="margin-top:8px"><button class="link" data-act="reply" data-id="${m.id}">送出</button></div>`:'')}
  </div>`).join('');
  return `<section class="agent-sec"><h2>顯影</h2>
    <p class="lead">它一直在看，只在真的看見什麼的時候才開口。它不會告訴你該怎麼做，也不會猜你的心情。</p>
    <p class="status">${esc(status)}</p>
    <div class="row"><button class="btn" data-act="check" ${(S.busy||!agentReady()||!hasKey)?'disabled':''}>讓它看一次</button></div>
    ${prints}</section>`;
}

/* ---------- 拍下 ---------- */
let capTimer=null, capSafe=null;
function openCap(theme,moment,pt){
  if(capSafe){ capSafe.destroy(); capSafe=null }
  S.cap={theme:theme||null,moment:!!moment,start:Date.now(),img:null,line:''};
  const ovc=$('#ovCap');
  fx.ov.show(ovc,pt?{from:pt}:{});
  capSafe=fx.safelight.mount(ovc);
  renderCap();
  clearInterval(capTimer); capTimer=setInterval(()=>{const el=$('#cd');if(el)el.replaceWith(cdEl())},250);
}
function closeCap(){ clearInterval(capTimer); S.cap=null; fx.ov.hide($('#ovCap'),()=>{ if(capSafe){ capSafe.destroy(); capSafe=null } }) }
function cdEl(){
  const left=Math.max(0,120000-(Date.now()-S.cap.start));
  if(capSafe) capSafe.setLeft(left/120000);

/* 一張照片存兩份：

const FULL_PX=2560, FULL_Q=.86, THUMB_PX=720, THUMB_Q=.82;
function drawScaled(src,M){
  const s=Math.min(1,M/Math.max(src.width,src.height)), w=Math.round(src.width*s), h=Math.round(src.height*s);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const g=cv.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(src,0,0,w,h); return cv;
}
async function processPhoto(file){
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    const full=await new Promise(r=>drawScaled(bmp,FULL_PX).toBlob(r,'image/jpeg',FULL_Q));
    const img=drawScaled(bmp,THUMB_PX).toDataURL('image/jpeg',THUMB_Q);
    bmp.close&&bmp.close();
    return {img,full};
  }catch(err){ console.error(err); return null }
}
async function thumbFromBlob(b){
  try{ const bmp=await createImageBitmap(b); const u=drawScaled(bmp,THUMB_PX).toDataURL('image/jpeg',THUMB_Q); bmp.close&&bmp.close(); return u }catch{ return null }
}
/* 原圖網址（有原圖就用原圖，沒有就退回縮圖）；只留最近 16 張的 object URL */
const fullURLs=new Map();
async function photoURL(e){
  if(!e||!e.img) return e&&e.img;
  if(fullURLs.has(e.id)) return fullURLs.get(e.id);
  const b=await getPhoto(e.id); if(!b) return e.img;
  const u=URL.createObjectURL(b); fullURLs.set(e.id,u);
  if(fullURLs.size>16){ const [k,v]=fullURLs.entries().next().value; URL.revokeObjectURL(v); fullURLs.delete(k) }
  return u;
}
function forgetURL(id){ const u=fullURLs.get(id); if(u){ URL.revokeObjectURL(u); fullURLs.delete(id) } }

/* ---------- 存下來：9:16（1080×1920）的一天／一週／一個月 ---------- */
const EXC={bg:'#EAD8C8',paper:'#FAF3EA',paper2:'#E8D9CB',ink:'#2B211C',ink2:'#56443A',ink3:'#6A584C',safe:'#A84A33',dark:'#2B221D',
  sky:'#E6C7B8',haze:'#F2E4D6',horizon:'#E2CFBD',field:'#D4BB9F'};
const EXWORD='"Fraunces","Noto Serif TC",Georgia,serif';
const EXSERIF='"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",Georgia,serif';
const EXSANS='-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",Helvetica,Arial,sans-serif';
const imgCache=new Map();
function loadImg(src){
  if(imgCache.has(src)) return imgCache.get(src);
  const p=new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src });
  imgCache.set(src,p); return p;
}
function pickEntry(k,theme){ const es=S.entries.filter(x=>x.date===k&&x.theme===theme); return es.length?(es.find(y=>y.moment)||es[es.length-1]):null }
function coverDraw(g,im,x,y,w,h){
  const s=Math.max(w/im.width,h/im.height), sw=w/s, sh=h/s;
  g.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,x,y,w,h);
}
function spaced(g,txt,x,y,sp,align){
  const chars=[...txt], ws=chars.map(c=>g.measureText(c).width), tot=ws.reduce((a,b)=>a+b,0)+sp*(chars.length-1);
  let cx=align==='center'?x-tot/2:align==='right'?x-tot:x; const a0=g.textAlign; g.textAlign='left';
  chars.forEach((c,i)=>{ g.fillText(c,cx,y); cx+=ws[i]+sp }); g.textAlign=a0; return tot;
}
function wrapText(g,txt,x,y,maxW,lh,maxLines){
  let line='', lines=[];
  for(const c of [...txt]){ if(g.measureText(line+c).width>maxW&&line){ lines.push(line); line=c } else line+=c }
  if(line) lines.push(line);
  if(lines.length>maxLines){ lines=lines.slice(0,maxLines); lines[maxLines-1]=lines[maxLines-1].slice(0,-1)+'…' }
  lines.forEach((l,i)=>g.fillText(l,x,y+i*lh)); return lines.length;
}
let grainPat=null;
function paperBg(g,W,H){
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,EXC.sky); gr.addColorStop(.46,EXC.haze); gr.addColorStop(.6,EXC.horizon); gr.addColorStop(1,EXC.field);
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  // 車窗外流過的樹影：很淡、很糊的一條帶
  g.save(); g.filter='blur(28px)'; g.globalAlpha=.16; g.fillStyle='#8C786B';
  for(let x=-60;x<W+60;x+=70){ const h=60+((x*37)%90); g.beginPath(); g.ellipse(x,H*.58-h*.35,48,h,0,0,Math.PI*2); g.fill() }
  g.restore();
  // 水平的動態模糊紋
  g.save(); g.globalAlpha=.035; g.filter='blur(1.5px)';
  for(let y=0;y<H;y+=6){ const v=(Math.sin(y*.071)+Math.sin(y*.023+1.7))*.5; g.fillStyle=v>0?'#FFF7EE':'#6E5847'; g.fillRect(0,y,W,3) }
  g.restore();
  if(!grainPat){ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d'), d=x.createImageData(256,256);
    for(let i=0;i<d.data.length;i+=4){ const v=Math.random()*255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255 } x.putImageData(d,0,0); grainPat=c }
  g.save(); g.globalAlpha=.06; g.fillStyle=g.createPattern(grainPat,'repeat'); g.fillRect(0,0,W,H); g.restore();

async function frameDraw(g,e,tname,x,y,w,h,fs){
  if(!e){ g.fillStyle=EXC.paper2; g.fillRect(x,y,w,h); g.fillStyle=EXC.ink3; g.font=`${Math.round(fs*.8)}px ${EXSANS}`; g.textBaseline='alphabetic'; g.fillText(tname,x+fs*.6,y+h-fs*.55); return }
  const im=e.img?await loadImg(e.img):null;
  if(im) coverDraw(g,im,x,y,w,h);
  else{ g.fillStyle=EXC.dark; g.fillRect(x,y,w,h); g.fillStyle=EXC.paper; g.font=`${fs}px ${EXSERIF}`; g.textBaseline='alphabetic';
    const lh=fs*1.5, n=Math.max(1,Math.floor((h-fs)/lh)); wrapText(g,e.line||tname,x+fs*.7,y+h-fs*.7-(Math.min(n,Math.ceil(g.measureText(e.line||tname).width/(w-fs*1.4)))-1)*lh,w-fs*1.4,lh,n) }
}
/* 一條拍貼：o={fw,fh,pad,gap,foot,fs,label,today,future} */
async function stripDraw(g,k,x,y,o){
  const W=o.fw+o.pad*2, H=o.pad+o.fh*4+o.gap*3+o.foot;

  g.save(); g.shadowColor='rgba(0,0,0,.22)'; g.shadowBlur=o.pad*1.6; g.shadowOffsetY=o.pad*.5; g.fillStyle=EXC.paper; g.fillRect(x,y,W,H); g.restore();
  const th=THEMES();
  for(let i=0;i<4;i++) await frameDraw(g,o.future?null:pickEntry(k,th[i].k),th[i].n,x+o.pad,y+o.pad+i*(o.fh+o.gap),o.fw,o.fh,o.fs);
  const fy=y+o.pad+o.fh*4+o.gap*3+o.foot*.6;
  g.textBaseline='middle'; g.fillStyle=EXC.ink; g.font=`600 ${Math.round(o.foot*.34)}px ${EXSERIF}`;
  g.font=`600 ${Math.round(o.foot*.36)}px ${EXWORD}`; g.fillText('Revela',x+o.pad,fy);
  g.fillStyle=o.today?EXC.safe:EXC.ink2; g.font=`${o.today?'600 ':''}${Math.round(o.foot*.32)}px ${EXSERIF}`; g.textAlign='right'; g.fillText(o.label,x+W-o.pad,fy); g.textAlign='left';
  g.restore(); return {W,H};
}
function header(g,small,big,sub){

function brand(g,W,y){ g.fillStyle=EXC.ink; g.font=`600 46px ${EXWORD}`; g.textBaseline='middle'; g.textAlign='center'; g.fillText('Revela',W/2,y); g.textAlign='left' }
async function renderExport(kind){

        g.fillStyle=EXC.paper; g.font=`600 52px ${EXWORD}`; g.textBaseline='middle'; g.textAlign='center'; g.fillText('Revela',x+sw/2,y+sh/2-30); g.textAlign='left';
        g.font=`26px ${EXSERIF}`; g.globalAlpha=.75; g.textAlign='center'; g.fillText(`${ws.getMonth()+1}/${ws.getDate()} – ${e.getMonth()+1}/${e.getDate()}`,x+sw/2,y+sh/2+36); g.textAlign='left'; g.globalAlpha=1;

      const fut=d.getTime()>now&&k!==today, es=S.entries.filter(z=>z.date===k), pick=es.find(z=>z.moment&&z.img)||es.find(z=>z.img);
      g.save(); if(fut) g.globalAlpha=.4;
      g.save(); g.shadowColor='rgba(0,0,0,.16)'; g.shadowBlur=10; g.shadowOffsetY=3; g.fillStyle=EXC.paper; g.fillRect(x,y,cw,ch); g.restore();
      const ix=x+6, iy=y+6, iw=cw-12, ih=ch-46;
      const im=pick?await loadImg(pick.img):null;
      if(im) coverDraw(g,im,ix,iy,iw,ih); else{ g.fillStyle=es.length?EXC.dark:EXC.paper2; g.fillRect(ix,iy,iw,ih) }
      g.fillStyle=k===today?EXC.safe:EXC.ink; g.font=`${k===today?'600 ':''}24px ${EXSERIF}`; g.textBaseline='middle'; g.fillText(String(n),x+9,y+ch-20);
      if(es.length>1){ g.fillStyle=EXC.ink3; g.font=`18px ${EXSANS}`; g.textAlign='right'; g.fillText('·'.repeat(Math.min(4,es.length)),x+cw-9,y+ch-20); g.textAlign='left' }
      g.restore();
    }
  }
  brand(g,W,H-95);
  return new Promise(res=>cv.toBlob(b=>res(b),'image/jpeg',.92));
}

/* ---------- 雲端備份（Supabase） ----------
   預設不用登入：第一次開啟就用「匿名登入」自動備份（照片 → Storage photos/<uid>/<id>.jpg、資料 → entries）。
   匿名帳號清掉瀏覽器資料或換手機就找不回來，所以設定裡可以「綁定 email」（選填）：
     · email 沒人用過 → 把這個匿名帳號升級成 email 帳號（updateUser + 驗證碼 type=email_change）
     · email 已經有帳號 → 改成登入那個帳號（signInWithOtp + type=email），本機資料會補傳進去、雲端資料會還原回來
   使用者可以隨時暫停備份（設定裡）；暫停後不會再自動建立匿名帳號。 */
const SB={client:null,user:null,busy:false,err:'',last:0,again:false,anonBusy:false,anonErr:''};
S.bk={step:'email',email:'',msg:'',mode:'link'};
const bkOn=()=>!(S.settings&&S.settings.backup===false);
const isAnon=()=>!!(SB.user&&SB.user.is_anonymous);
function sbInit(){
  const c=window.SUPABASE_CONFIG;
  if(!c||!window.supabase||!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(c.url||'')||!c.anonKey||/PASTE|YOUR/.test(c.anonKey)) return;
  try{
    SB.client=window.supabase.createClient(c.url.replace(/\/$/,''),c.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'revela-auth'}});
  }catch(err){ console.error('supabase',err); SB.client=null; return }
  SB.client.auth.onAuthStateChange((ev,session)=>{
    const u=session?session.user:null, changed=(u&&u.id)!==(SB.user&&SB.user.id);
    SB.user=u; refreshBk();
    if(changed){ if(S.settings&&!S.cap) render(); if(u) setTimeout(()=>{ syncAll(); maybeAutoRun() },0) }
  });
  SB.client.auth.getSession().then(()=>sbEnsure());
}
/* 沒有登入、備份又是開著的，就在背景建立匿名帳號（要先有網路，沒網路等 online 事件） */
async function sbEnsure(){
  if(!SB.client||SB.user||SB.anonBusy||!S.settings||!bkOn()||!navigator.onLine) return;
  SB.anonBusy=true; SB.anonErr='';
  try{
    const {data,error}=await SB.client.auth.getSession();
    if(!error&&data&&data.session){ SB.user=data.session.user; return }
    const r=await SB.client.auth.signInAnonymously();
    if(r.error) throw r.error;
  }catch(err){ console.error('anon',err); SB.anonErr=String(err&&err.message||err) }
  finally{ SB.anonBusy=false; refreshBk() }
}
async function setBackup(on){
  S.settings=Object.assign({},S.settings,{backup:on}); await kvSet('settings',S.settings);
  if(on){ await sbEnsure(); syncSoon(300) }
  refreshBk(); const n=$('#dataNote'); if(n) n.textContent=dataNote();
}
/* 想綁 email：先試著把目前的匿名帳號升級；email 已經有人用就改成登入那個帳號 */
async function sbSend(){
  const em=(($('#bkEmail')||{}).value||'').trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ S.bk.msg='email 看起來不太對。'; refreshBk(); return }
  S.bk={step:'email',email:em,msg:'寄送中…',mode:'link'}; refreshBk();
  const rateMsg=e=>/rate|limit|seconds|too many/i.test(e.message||'')?'寄得太頻繁了，等一下再試。':'寄不出去：'+e.message;
  if(SB.user&&SB.user.is_anonymous){
    const {error}=await SB.client.auth.updateUser({email:em});
    if(!error){ S.bk={step:'code',email:em,msg:'',mode:'link'}; refreshBk(); setTimeout(()=>{ const i=$('#bkCode'); i&&i.focus() },60); return }
    if(!/already|registered|exists|taken|duplicate/i.test((error.code||'')+' '+(error.message||''))){ S.bk.msg=rateMsg(error); refreshBk(); return }
    // 這個 email 已經有帳號：登入它。先把這個匿名帳號在雲端的副本清掉（本機還在，登入後會補傳進新帳號）
    await sbWipeCloud(true);
  }
  const {error}=await SB.client.auth.signInWithOtp({email:em,options:{shouldCreateUser:true}});
  if(error){ S.bk.msg=rateMsg(error); refreshBk(); return }
  S.bk={step:'code',email:em,msg:'',mode:'signin'}; refreshBk(); setTimeout(()=>{ const i=$('#bkCode'); i&&i.focus() },60);
}
async function sbVerify(){
  const code=(($('#bkCode')||{}).value||'').replace(/\D/g,'');
  if(code.length<6){ S.bk.msg='輸入信裡的數字驗證碼。'; refreshBk(); return }
  const mode=S.bk.mode, em=S.bk.email;
  S.bk.msg='確認中…'; refreshBk();
  const {error}=await SB.client.auth.verifyOtp({email:em,token:code,type:mode==='link'?'email_change':'email'});
  if(error){ S.bk.msg=/expired|invalid/i.test(error.message)?'驗證碼不對或過期了，再寄一次。':'沒有成功：'+error.message; refreshBk(); return }
  S.bk={step:'email',email:'',msg:'',mode:'link'};
  if(mode==='link'){ try{ const {data}=await SB.client.auth.getUser(); if(data&&data.user) SB.user=data.user }catch{} }
  refreshBk(); render(); syncSoon(200);
}

  }
  const total=S.entries.length, done=S.entries.filter(e=>e.sync==='done').length;
  const st=SB.busy?'備份中…':SB.err?SB.err:(done===total?`全部 ${total} 則都備份好了。`:`${done}／${total} 則已備份，其餘有網路時會自動補上。`);
  const status=`<p class="st ${SB.err?'err':''}">${esc(st)}${SB.last&&!SB.busy?`<br>上次同步：${rel(SB.last)}`:''}</p>
    <div class="row2" style="margin-bottom:12px"><button class="btn" data-act="sbsync" ${SB.busy?'disabled':''}>立即同步</button></div>`;
  if(isAnon()) return `<h3>備份</h3><p class="st">照片已經自動備份，不用登入。</p>${status}

    <p style="margin-top:12px">${sw(false)}　<button class="link" data-act="sbwipe">刪除雲端上的所有資料</button></p>`;
  return `<h3>備份</h3><p class="st">已綁定 ${esc(SB.user.email||'')}，換手機登入同一個 email 就找得回來。</p>${status}
    <button class="link" data-act="sbout">登出並暫停備份</button>　${sw(false)}　<button class="link" data-act="sbwipe">刪除雲端上的所有資料</button>`;

function dataNote(){ return !bkOn()?'紀錄和照片目前只存在這支手機。移除 App 或清掉瀏覽器資料就會一起消失。':'紀錄和照片存在這支手機，也會自動備份到雲端；雲端只有你自己看得到。' }
function refreshBk(){ const g=$('#bkGrp'); if(g) g.innerHTML=bkHTML(); const n=$('#dataNote'); if(n) n.textContent=dataNote() }
let syncT=null;
function syncSoon(ms){ clearTimeout(syncT); syncT=setTimeout(()=>syncAll(),ms==null?600:ms) }
async function queueDel(id){ if(!SB.client||!bkOn()) return; const l=await kvGet('syncDel')||[]; if(!l.includes(id)){ l.push(id); await kvSet('syncDel',l) } syncSoon() }
async function syncAll(manual){
  if(!SB.client||!bkOn()) return;
  if(!SB.user){ sbEnsure(); return }
  if(SB.busy){ SB.again=true; return }
  if(!navigator.onLine){ if(manual){ SB.err='現在沒有網路，連上之後會自動補上。'; refreshBk() } return }
  SB.busy=true; SB.err=''; refreshBk();
  const uid=SB.user.id, store=SB.client.storage.from('photos');
  try{
    // 換了帳號：本機全部重新上傳到新帳號
    if((await kvGet('syncUid'))!==uid){ for(const e of S.entries){ if(e.sync){ delete e.sync; await putEntry(e) } } await kvSet('syncUid',uid) }
    // 1) 刪除
    const dels=await kvGet('syncDel')||[];
    for(const id of dels.slice()){
      await store.remove([`${uid}/${id}.jpg`]);
      const {error}=await SB.client.from('entries').delete().eq('user_id',uid).eq('id',id); if(error) throw error;
      dels.splice(dels.indexOf(id),1); await kvSet('syncDel',dels);
    }
    // 2) 上傳
    for(const e of S.entries.slice()){
      if(e.sync==='done') continue;
      let blob=null;
      if(e.img){ blob=await getPhoto(e.id); if(!blob){ blob=await (await fetch(e.img)).blob() } }   // 舊紀錄沒有原圖，就備份手上最好的那張
      if(blob){ const {error}=await store.upload(`${uid}/${e.id}.jpg`,blob,{upsert:true,contentType:'image/jpeg',cacheControl:'31536000'}); if(error) throw error }
      const {error}=await SB.client.from('entries').upsert({user_id:uid,id:e.id,ts:e.ts,date:e.date,theme:e.theme,line:e.line||'',late:!!e.late,moment:!!e.moment,has_photo:!!blob,updated_at:new Date().toISOString()});
      if(error) throw error;
      e.sync='done'; await putEntry(e); refreshBk();
    }
    // 3) 還原：雲端有、本機沒有
    const have=new Set(S.entries.map(e=>e.id)), skip=new Set(await kvGet('syncDel')||[]);
    let added=0;
    for(let from=0;;from+=1000){
      const {data,error}=await SB.client.from('entries').select('id,ts,date,theme,line,late,moment,has_photo').order('ts').range(from,from+999);
      if(error) throw error;
      for(const r of data||[]){
        if(have.has(r.id)||skip.has(r.id)) continue;
        const e={id:r.id,ts:Number(r.ts),date:r.date,theme:r.theme,line:r.line||'',late:!!r.late,moment:!!r.moment,img:null,sync:'done'};
        if(r.has_photo){ const {data:b,error:er}=await store.download(`${uid}/${r.id}.jpg`); if(!er&&b){ await putPhoto(r.id,b); e.img=await thumbFromBlob(b) } }
        S.entries.push(e); await putEntry(e); have.add(r.id); added++;
      }
      if(!data||data.length<1000) break;
    }
    if(added){ S.entries.sort((a,b)=>a.ts-b.ts); if(!S.cap) render() }
    SB.last=Date.now(); await kvSet('syncLast',SB.last);
  }catch(err){ console.error('sync',err); SB.err='這次備份沒有成功，等一下會自己再試。' }
  SB.busy=false; refreshBk();
  if(SB.again){ SB.again=false; syncSoon(300) }
}
/* 刪掉目前帳號在雲端的所有照片與紀錄，並把本機的「已備份」標記清掉（之後若再開備份會重新上傳） */
async function sbWipeCloud(quiet){
  const uid=SB.user.id, store=SB.client.storage.from('photos');
  for(;;){
    const {data,error}=await store.list(uid,{limit:1000}); if(error) throw error;
    if(!data||!data.length) break;
    const {error:e2}=await store.remove(data.map(o=>`${uid}/${o.name}`)); if(e2) throw e2;
    if(data.length<1000) break;
  }
  const {error}=await SB.client.from('entries').delete().eq('user_id',uid); if(error) throw error;
  for(const e of S.entries){ if(e.sync){ delete e.sync; await putEntry(e) } }
  await kvDel('syncDel'); await kvDel('syncUid');
}
async function sbWipe(){
  if(!SB.user) return;
  if(!confirm('刪除雲端上你所有的照片和紀錄，並暫停備份？\n這支手機上的紀錄不受影響。雲端的部分無法復原。')) return;
  SB.busy=true; refreshBk();
  try{
    await sbWipeCloud();
    S.settings=Object.assign({},S.settings,{backup:false}); await kvSet('settings',S.settings);
    try{ await SB.client.auth.signOut({scope:'local'}) }catch{}
    SB.busy=false; alert('雲端上的資料已經刪掉了，備份也暫停了。');
  }catch(err){ console.error(err); SB.busy=false; SB.err='刪除沒有完成，請再試一次。' }
  refreshBk(); render();
}

/* ---------- 顯影：觀察者 ---------- */
/* 顯影在我們自己的後端（Supabase Edge Function「observe」）執行，金鑰只存在後端 */
const agentCan=()=>!!(SB.client&&SB.user&&bkOn());
async function runAgent(){
  if(S.busy||!agentReady()||!agentCan()) return;
  S.busy=true; S.err=''; render();
  try{
    const {data:ss}=await SB.client.auth.getSession(); const tok=ss&&ss.session&&ss.session.access_token; if(!tok) throw new Error('auth');
    const log=S.entries.map(e=>({d:e.date,w:'週'+WD[parseD(e.date).getDay()],h:new Date(e.ts).getHours(),t:themeName(e.theme),l:e.line||'',late:!!e.late,moment:!!e.moment}));
    const imgs=S.entries.filter(e=>e.img).slice(-10).map(e=>e.img.split(',')[1]);
    const past=S.agentLog.map(m=>({when:new Date(m.ts).toISOString().slice(0,10),mode:m.mode,said:m.text,reaction:m.reaction||null,reply:m.reply||''}));
    const res=await fetch(window.SUPABASE_CONFIG.url.replace(/\/$/,'')+'/functions/v1/observe',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok,'apikey':window.SUPABASE_CONFIG.anonKey},
      body:JSON.stringify({today:dkey(new Date()),habit:(S.settings&&S.settings.habit)||'',entries:log,past_observations:past,images:imgs})});
    const out=await res.json().catch(()=>({}));
    if(res.status===429){ S.err='今天看了幾次了，明天再讓它看。'; S.busy=false; render(); return }
    if(!res.ok||out.error) throw new Error(out.error||('http '+res.status));
    S.agentMeta={lastCheck:Date.now(),lastCount:S.entries.length,lastSpoke:!!(out.speak&&out.text)};
    if(out.speak&&out.text){ S.freshId=String(Date.now()); S.agentLog.push({id:S.freshId,ts:Date.now(),mode:out.mode||'say',text:String(out.text).trim(),reaction:null,reply:''}); await kvSet('agentLog',S.agentLog) }
    await kvSet('agentMeta',S.agentMeta);
  }catch(e){ console.error(e); S.err='它這次沒看清楚。等一下再讓它看一次。' }
  S.busy=false; render();
}
function maybeAutoRun(){
  if(!agentReady()||S.busy||!agentCan()) return;
  const m=S.agentMeta, fresh=m.lastCheck&&(Date.now()-m.lastCheck)<20*36e5;
  if(!fresh&&S.entries.length>(m.lastCount||0)) runAgent();
}

/* ---------- 事件 ---------- */
document.addEventListener('click',async ev=>{
  const a=ev.target.closest('[data-act]'); if(!a) return;
  const d=a.dataset;
  switch(d.act){
    case 'onboard':{ const h=($('#habit').value||'健身').trim().slice(0,8)||'健身'; S.settings={habit:h,since:dkey(new Date())}; await kvSet('settings',S.settings); render({enter:true}); sbEnsure(); break }
    case 'nav': if(d.v!==S.view){ S.view=d.v; render({enter:true,nav:true}); dotView=d.v } fx.nav(d.v); if(d.v==='today') maybeAutoRun(); break;
    case 'install': if(S.installEvt){ S.installEvt.prompt(); await S.installEvt.userChoice; S.installEvt=null; render() } break;
    case 'asknotif': try{ S.notif=await Notification.requestPermission() }catch{} render(); break;
    case 'cap':{ const r=a.getBoundingClientRect(); openCap(d.theme||null,d.moment==='1',{x:Math.round(r.left+r.width/2),y:Math.round(r.top+r.height/2)}); break }
    case 'theme': S.cap.theme=d.k; S.cap.line=$('[data-line]').value; renderCap(); break;
    case 'capclose': closeCap(); break;
    case 'capsave': S.cap.line=$('[data-line]').value; await saveCap(); break;
    case 'open':{ const r=a.getBoundingClientRect(); openEntry(d.id,{x:Math.round(r.left+r.width/2),y:Math.round(r.top+r.height/2)}); break }
    case 'wday': goDay(Number(d.i)); break;
    case 'full': openFull(d.id,a); break;
    case 'fullsib': openFull(d.id); break;
    case 'fullclose': closeFull(); break;
    case 'fulldel':{ if(!confirm('刪掉這一則？')) break; S.entries=S.entries.filter(x=>x.id!==d.id); await delEntry(d.id); await delPhoto(d.id); forgetURL(d.id); queueDel(d.id); closeFull(true); render(); break }
    case 'save': openSave(); break;
    case 'expkind': S.exp=d.k; buildExport(); break;
    case 'expsave': saveExport(); break;
    case 'expclose': closeSave(); break;
    case 'eclose': closeEntry(); break;
    case 'edel':{ if(!confirm('刪掉這一則？')) break; S.entries=S.entries.filter(x=>x.id!==d.id); await delEntry(d.id); await delPhoto(d.id); forgetURL(d.id); queueDel(d.id); closeEntry(); render(); break }
    case 'play': playWeek(); break;
    case 'check': runAgent(); break;
    case 'react':{ const m=S.agentLog.find(x=>x.id===d.id); if(m){ m.reaction=d.r; await kvSet('agentLog',S.agentLog); render() } break }
    case 'reply':{ const m=S.agentLog.find(x=>x.id===d.id); const ta=document.querySelector(`[data-reply="${d.id}"]`); if(m&&ta&&ta.value.trim()){ m.reply=ta.value.trim().slice(0,200); await kvSet('agentLog',S.agentLog) } render(); break }
    case 'settings': openSettings(); break;
    case 'sbsend': sbSend(); break;
    case 'sbverify': sbVerify(); break;
    case 'sbback': S.bk={step:'email',email:S.bk.email,msg:'',mode:'link'}; refreshBk(); break;
    case 'sbsync': syncAll(true); break;
    case 'sbout':{ if(!confirm('登出之後，這支手機上的紀錄還在，但會暫停備份。要再備份時，到設定重新開啟。')) break; try{ await SB.client.auth.signOut({scope:'local'}) }catch{} await setBackup(false); render(); break }
    case 'bkoff': await setBackup(false); break;
    case 'bkon': await setBackup(true); break;
    case 'sbretry': SB.anonErr=''; sbEnsure(); break;
    case 'bkhint': S.settings=Object.assign({},S.settings,{hintSeen:true}); await kvSet('settings',S.settings); if(d.go==='1') openSettings(); render(); break;
    case 'sbwipe': sbWipe(); break;
    case 'setsave':{ S.settings=Object.assign({},S.settings,{habit:($('#setHabit').value||'習慣').trim().slice(0,8)||'習慣'});
      await kvSet('settings',S.settings); const m=$('#setMsg'); if(m) m.textContent='存好了。'; break }
    case 'export':{ const blob=new Blob([JSON.stringify({entries:S.entries,agentLog:S.agentLog},null,2)],{type:'application/json'});
      const u=URL.createObjectURL(blob), a2=document.createElement('a'); a2.href=u; a2.download='Revela-'+dkey(new Date())+'.json'; a2.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); break }
    case 'reset':{ if(!confirm(SB.user?'清掉這支手機上的所有紀錄與它說過的話？雲端備份不會被刪（要刪請先在設定裡按「刪除雲端上的所有資料」）。這支手機會登出，沒有綁定 email 的話，雲端那份之後就找不回來了。':'清掉所有紀錄與它說過的話？這無法復原。')) break;
      if(SB.client&&SB.user){ try{ await SB.client.auth.signOut({scope:'local'}) }catch{} }
      SB.user=null; SB.anonErr='';
      await clearEntries(); await clearPhotos(); await kvDel('syncDel'); await kvDel('syncUid'); await kvDel('agentLog'); await kvDel('agentMeta'); await kvDel('settings');
      for(let i=0;i<400;i++){ const dd=new Date(); dd.setDate(dd.getDate()-i); await kvDel('moment:'+dkey(dd)) }
      S.entries=[]; S.agentLog=[]; S.agentMeta={}; S.settings=null; S.view='today';
      await ensureMoment(); render(); break }
  }
});
document.addEventListener('change',async ev=>{
  if(ev.target.matches('[data-file]')&&S.cap){ const f=ev.target.files&&ev.target.files[0]; if(!f) return; S.cap.line=$('[data-line]').value; const r=await processPhoto(f); S.cap.img=r?r.img:null; S.cap.full=r?r.full:null; renderCap() }
});
document.addEventListener('input',ev=>{ if(ev.target.matches('[data-line]')&&S.cap) S.cap.line=ev.target.value });
$('#ovSlide').addEventListener('click',closeSlide);
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){ closeSlide(); closeEntry(); closeFull(); closeSave(); if(S.cap) closeCap(); return }
  // 這週：方向鍵也能翻（桌面用）
  if(S.view!=='week'||document.querySelector('.ov.show')||/INPUT|TEXTAREA/.test((ev.target||{}).tagName||'')) return;
  const k={ArrowLeft:()=>goDay(S.dayIdx-1),ArrowRight:()=>goDay(S.dayIdx+1),ArrowUp:()=>goWeek(-1),ArrowDown:()=>goWeek(1)}[ev.key];
  if(k){ ev.preventDefault(); k() }
});
let rsT=null;
window.addEventListener('resize',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ if(S.view==='week'&&$('#booth')){ layoutBooth(); placeBooth() } },120) });

window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); S.installEvt=e; if(S.settings&&S.view==='today') render() });
document.addEventListener('visibilitychange',async()=>{ if(!document.hidden){ S.dayKey=dkey(new Date()); await ensureMoment(); if(!S.cap) render() } });
/* 每 20 秒檢查一次；只有「時刻狀態」或日期真的變了才重繪，不再整頁無謂重畫 */
setInterval(async()=>{
  await tickMoment();
  $('#hdate').textContent=fmtDate(new Date());
  if(dkey(new Date())!==S.dayKey){ S.dayKey=dkey(new Date()); await ensureMoment(); if(!S.cap) render(); return }
  if(S.view==='today'&&S.settings&&!S.cap&&bannerSig()!==lastBanner) render();
},20000);

/* 新版上線時自動換：背景回來會檢查一次，新的 Service Worker 接手後重新載入（拍照中不打斷） */
const APP_VER='v12';
if('serviceWorker' in navigator){
  const hadCtrl=!!navigator.serviceWorker.controller; let reloading=false, swReg=null;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!hadCtrl||reloading||S.cap) return; reloading=true; location.reload() });
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>{ swReg=r }).catch(e=>console.error('sw',e)));
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&swReg) swReg.update().catch(()=>{}) });
}
load().then(async()=>{ SB.last=await kvGet('syncLast')||0; sbInit(); render({enter:true}); tickMoment(); maybeAutoRun() });
</script>
</body>
