<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>顯影</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#B8B4AC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="顯影">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./vendor/lenis.css">
<style>
  :root{
    --card:#B8B4AC; --paper:#ECE8DF; --paper-2:#DCD7CC;
    --ink:#1B1A18; --ink-2:#5C5850; --ink-3:#86817A;
    --safe:#A8362A; --line:rgba(27,26,24,.16);
    --serif:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--card);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  img{display:block}

  /* 視覺層：底片質感背景、安全燈、顯影照片 */
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s ease}
  #bg.on{opacity:1}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .fx-photo{display:block;opacity:0;max-width:100%}
  .fx-safe{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

  #app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  header.top{display:flex;align-items:baseline;justify-content:space-between;padding:max(22px,env(safe-area-inset-top)) 22px 10px}
  header.top h1{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.08em;margin:0}
  header.top .date{font-size:13px;color:var(--ink-2)}
  main{flex:1;padding:6px 22px 110px}

  nav.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;
    display:flex;background:var(--card);border-top:1px solid var(--line);
    padding:8px 10px max(14px,env(safe-area-inset-bottom))}
  nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 14px;font-size:14px;color:var(--ink-3);position:relative;letter-spacing:.04em}
  nav.tabs button.on{color:var(--ink)}
  #navdot{position:absolute;left:0;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 6px);width:4px;height:4px;border-radius:50%;background:var(--ink);pointer-events:none}

  .paper{background:var(--paper);padding:14px 16px;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.04);margin-bottom:10px}
  .muted{color:var(--ink-2)} .small{font-size:13px}
  p.lead{font-family:var(--serif);font-size:17px;line-height:1.85;margin:6px 0 14px}

  .btn{display:inline-block;padding:11px 16px;border:1px solid var(--ink);background:transparent;border-radius:2px;font-size:15px;line-height:1;text-align:center}
  .btn.fill{background:var(--ink);color:var(--paper)}
  .btn.wide{width:100%;padding:14px 16px}
  .btn:disabled{opacity:.45;cursor:default}
  .link{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:13px}

  .notice{background:var(--paper);border-left:2px solid var(--safe);padding:12px 14px;margin:0 0 14px;font-size:14px;line-height:1.7;color:var(--ink-2)}
  .notice .btn{margin-top:10px;padding:9px 14px;font-size:14px}

  .moment{border-radius:3px;margin:8px 0 18px;text-align:left;width:100%;border:0}
  .moment.wait{background:var(--paper);padding:16px}
  .moment.wait .t{font-family:var(--serif);font-size:18px;margin:0 0 4px}
  .moment.now{background:var(--safe);color:var(--paper);padding:26px 18px 22px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .moment.now .t{font-family:var(--serif);font-size:30px;letter-spacing:.06em;margin:0 0 6px;font-weight:600}
  .moment.now .s{font-size:14px;opacity:.9}
  .moment.done{background:var(--paper-2);padding:14px 16px;color:var(--ink-2);font-family:var(--serif);font-size:16px}
  .row{display:flex;gap:10px;align-items:center;margin:0 0 18px}
  .entry{display:flex;gap:12px;align-items:flex-start}
  .entry .th{width:64px;height:64px;flex:none;background:var(--paper-2);border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .entry .th img{width:100%;height:100%;object-fit:cover}
  .entry .line{font-family:var(--serif);font-size:16px;line-height:1.6;margin:0 0 4px}
  .entry .meta{font-size:12px;color:var(--ink-3)}
  .entry button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;width:100%}
  .empty{font-family:var(--serif);color:var(--ink-2);font-size:16px;line-height:1.8;padding:10px 0}

  /* 這週：拍貼機。一天一條四格，左右換天、上下換週 */
  main.v-week{padding-bottom:0}
  .weekhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 10px}
  .weekhead .rng{font-family:var(--serif);font-size:19px;letter-spacing:.02em}
  .weekhead .hint{font-size:12px;color:var(--ink-2);margin-top:3px}
  .weekhead .btn{padding:9px 13px;font-size:14px;flex:none}
  .wdays{display:flex;justify-content:space-between;margin:0 0 4px}
  .wdays button{flex:1;background:none;border:0;padding:6px 0 8px;font-family:var(--serif);font-size:14px;color:var(--ink-2);position:relative}
  .wdays button.on{color:var(--ink);font-weight:600}
  .wdays button.on::after{content:"";position:absolute;left:50%;bottom:2px;width:14px;height:2px;margin-left:-7px;background:var(--ink)}
  .wdays button.td{color:var(--safe)}
  .booth{margin:0 -22px;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .booth::-webkit-scrollbar,.wtrack::-webkit-scrollbar{display:none}
  .wrow{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative}
  .wrow .wk{position:absolute;left:22px;top:6px;font-size:11px;letter-spacing:.06em;color:var(--ink-3)}
  .wtrack{height:100%;display:flex;align-items:center;gap:var(--gap,16px);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
    overscroll-behavior-x:contain;scrollbar-width:none;padding:0 calc(50% - var(--sw,190px) / 2)}
  .strip{flex:none;width:var(--sw,190px);scroll-snap-align:center;scroll-snap-stop:always;background:var(--paper);padding:10px 10px 0;
    box-shadow:0 1px 0 rgba(0,0,0,.22),0 6px 18px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:6px;transition:opacity .3s}
  .strip.future{opacity:.42}
  .frame{width:var(--fw,170px);height:var(--fh,140px);background:#2A2826;border:0;padding:0;overflow:hidden;position:relative;display:block}
  .frame img{width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(1.02)}
  .frame.empty{background:var(--paper-2);cursor:default}
  .frame.empty span{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--ink-3);letter-spacing:.04em}
  .frame.txt{background:#2A2826;color:var(--paper);font-family:var(--serif);font-size:13px;line-height:1.5;text-align:left;padding:10px;display:flex;align-items:flex-end}
  .frame .n{position:absolute;right:6px;top:6px;background:rgba(236,232,223,.92);color:var(--ink);font-size:11px;padding:1px 6px;border-radius:999px}
  .strip .foot{height:34px;display:flex;align-items:center;justify-content:space-between;font-family:var(--serif);font-size:12px;color:var(--ink-2)}
  .strip .foot b{font-weight:600;letter-spacing:.18em;color:var(--ink)}
  .strip.today .foot .d{color:var(--safe);font-weight:600}
  /* 滿版：從格子放大 */
  .ov.full{background:transparent;overflow:hidden}
  .ov.full .bd{position:absolute;inset:0;background:#000}
  .ov.full .ph{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-out}
  .ov.full .ph.txt{display:flex;align-items:center;justify-content:center;padding:40px 32px;font-family:var(--serif);font-size:24px;line-height:1.8;color:var(--paper);background:#2A2826;overflow:hidden}
  .ov.full .fbar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:baseline;padding:max(20px,env(safe-area-inset-top)) 22px 40px;background:linear-gradient(rgba(0,0,0,.55),transparent);color:var(--paper);pointer-events:none}
  .ov.full .fbar>*{pointer-events:auto}
  .ov.full .fbar .t{font-family:var(--serif);letter-spacing:.08em;font-size:16px}
  .ov.full .link{color:var(--paper);opacity:.9}
  .ov.full .info{position:absolute;left:0;right:0;bottom:0;padding:56px 22px max(24px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7));color:var(--paper)}
  .ov.full .info .line{font-family:var(--serif);font-size:20px;line-height:1.6;margin:0 0 6px}
  .ov.full .info .meta{font-size:13px;opacity:.8;margin-bottom:14px}
  .ov.full .sibs{margin:0 0 14px}
  /* 存下來 */
  .ov.save{background:var(--ink);color:var(--paper)}
  .ov.save .link{color:var(--paper);opacity:.85}
  .ov.save h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0}
  .seg{display:flex;gap:8px;margin:18px 0 16px}
  .seg button{flex:1;background:transparent;border:1px solid rgba(236,232,223,.45);color:var(--paper);border-radius:999px;padding:9px 4px;font-size:14px}
  .seg button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .expv{display:flex;justify-content:center;margin:0 0 16px}
  .expv .pv{height:min(58vh,560px);aspect-ratio:9/16;background:#2A2826;display:flex;align-items:center;justify-content:center;color:rgba(236,232,223,.6);font-family:var(--serif);font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .expv img{height:100%;width:100%;object-fit:contain;display:block}
  .ov.save .btn.paper{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .ov.save .note{font-size:12px;opacity:.65;margin-top:10px;text-align:center;line-height:1.6}
  .weekhead .acts{display:flex;gap:8px;flex:none}
  .sibs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-12px 0 24px;font-size:13px;opacity:.85}
  .sibs button{width:44px;height:44px;padding:0;border:2px solid transparent;background:#000;overflow:hidden}
  .sibs button.on{border-color:var(--paper)}
  .sibs img{width:100%;height:100%;object-fit:cover}

  .print{background:var(--paper);padding:18px 18px 14px;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.05);margin-bottom:14px}
  .print .txt{font-family:var(--serif);font-size:18px;line-height:1.85;margin:0 0 10px}
  .print .when{font-size:12px;color:var(--ink-3);margin-bottom:12px}
  .print .fb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .print .fb .btn{padding:8px 12px;font-size:13px}
  .print .fb .chosen{font-size:13px;color:var(--ink-2)}
  .print textarea{width:100%;margin-top:10px;background:transparent;border:0;border-bottom:1px solid var(--ink-3);padding:6px 0;resize:none;font-family:var(--serif);font-size:15px;line-height:1.6}
  .print .reply{font-family:var(--serif);font-size:15px;color:var(--ink-2);margin-top:10px;padding-left:10px;border-left:2px solid var(--ink-3)}
  .status{font-family:var(--serif);font-size:16px;line-height:1.8;color:var(--ink-2);margin:0 0 14px}

  .ov{position:fixed;inset:0;z-index:50;overflow:auto;display:none}
  .ov.show{display:block}
  .ov .in{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(22px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom))}
  .ov.cap{background:var(--safe);color:var(--paper)}
  .ov.cap .in{position:relative;z-index:1}
  .ov.cap .top{display:flex;justify-content:space-between;align-items:baseline}
  .ov.cap .top .link{color:var(--paper);opacity:.85}
  .ov.cap .now{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:.06em;margin:22px 0 0}
  .ov.cap .cd{font-family:var(--serif);font-size:56px;font-variant-numeric:tabular-nums;line-height:1;margin:6px 0 4px}
  .ov.cap .cd.late{opacity:.6}
  .ov.cap .latemsg{font-size:14px;opacity:.9;min-height:20px;margin-bottom:18px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}
  .chip{background:transparent;border:1px solid rgba(236,232,223,.7);color:var(--paper);border-radius:999px;padding:8px 14px;font-size:14px}
  .chip.on{background:var(--paper);color:var(--safe);border-color:var(--paper)}
  .camlab{display:block;border:1px solid rgba(236,232,223,.8);border-radius:2px;padding:16px;text-align:center;font-size:16px;cursor:pointer;margin-bottom:14px}
  .camlab input{position:absolute;width:1px;height:1px;opacity:0}
  .prev{background:rgba(0,0,0,.18);margin-bottom:14px;max-height:42vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .prev img{max-width:100%;max-height:42vh;object-fit:contain}
  .ov.cap input.line{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(236,232,223,.7);padding:10px 0;font-family:var(--serif);font-size:18px;color:var(--paper);margin-bottom:22px}
  .ov.cap input.line::placeholder{color:rgba(236,232,223,.55)}
  .ov.cap .btn.paper{background:var(--paper);color:var(--safe);border-color:var(--paper)}

  .ov.dark{background:var(--ink);color:var(--paper)}
  .ov.dark .link{color:var(--paper);opacity:.8}
  .ov.dark .big{margin:18px 0;padding:10px;display:flex;justify-content:center}
  .ov.dark .big .fx-photo,.ov.dark .big .fx-photo-fb{box-shadow:0 0 0 10px var(--paper)}
  .ov.dark .big img{width:100%;max-height:62vh;object-fit:contain;background:#000}
  .ov.dark .line{font-family:var(--serif);font-size:20px;line-height:1.7;margin:0 0 8px}
  .ov.dark .meta{font-size:13px;opacity:.7;margin-bottom:26px}

  .ov.slide{background:#000;color:var(--paper);cursor:pointer}
  .ov.slide .in{padding:0;justify-content:center;position:relative}
  .ov.slide img{width:100%;max-height:100dvh;object-fit:contain}
  .ov.slide .cap{position:absolute;left:0;right:0;bottom:0;padding:22px calc(22px + env(safe-area-inset-left)) max(22px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6))}
  .ov.slide .cap .line{font-family:var(--serif);font-size:20px;margin:0 0 4px}
  .ov.slide .cap .meta{font-size:13px;opacity:.75}
  .ov.slide .bar{position:absolute;top:0;left:0;height:2px;background:var(--paper);width:0;z-index:2}
  .ov.slide .stage{display:flex;align-items:center;justify-content:center;width:100%;height:100dvh}

  .ov.sheet2{background:var(--card)}
  .ov.sheet2 h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 4px}
  .ov.sheet2 .grp{margin:26px 0 0}
  .ov.sheet2 .grp h3{font-size:14px;color:var(--ink-2);font-weight:600;margin:0 0 8px}
  .ov.sheet2 .grp p{font-size:14px;line-height:1.75;color:var(--ink-2);margin:0 0 10px}
  .ov.sheet2 input[type=password],.ov.sheet2 input[type=text]{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:11px 12px;font-size:15px;margin-bottom:10px}

  .onb h1{font-family:var(--serif);font-size:44px;font-weight:600;letter-spacing:.1em;margin:60px 0 26px}
  .onb p{font-family:var(--serif);font-size:17px;line-height:1.9;margin:0 0 6px}
  .onb label{display:block;margin:38px 0 8px;font-size:13px;color:var(--ink-2)}
  .onb input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--ink);padding:10px 0;font-family:var(--serif);font-size:20px;margin-bottom:34px}

  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="app">
  <header class="top"><h1>顯影</h1><span class="date" id="hdate"></span></header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-act="nav" data-v="today">今天</button>
    <button data-act="nav" data-v="week">這週</button>
    <button data-act="nav" data-v="agent">顯影</button>
    <i id="navdot" aria-hidden="true"></i>
  </nav>
</div>
<div class="ov cap" id="ovCap" data-lenis-prevent><div class="in" id="capBody"></div></div>
<div class="ov dark" id="ovEntry" data-lenis-prevent></div>
<div class="ov slide" id="ovSlide" data-lenis-prevent></div>
<div class="ov sheet2" id="ovSet" data-lenis-prevent></div>
<div class="ov full" id="ovFull" data-lenis-prevent></div>
<div class="ov save" id="ovSave" data-lenis-prevent></div>

<script src="./vendor/gsap.min.js"></script>
<script src="./vendor/lenis.min.js"></script>
<script src="./fx.js"></script>
<script>
/* ---------- 基本 ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const WD=['日','一','二','三','四','五','六'];
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>`${d.getMonth()+1}月${d.getDate()}日 週${WD[d.getDay()]}`;
const fmtTime=ts=>{const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

const S={view:'today',entries:[],agentLog:[],agentMeta:{},settings:null,moment:null,cap:null,
         weekOff:0,dayIdx:null,busy:false,err:'',freshId:null,dayKey:dkey(new Date()),installEvt:null,notif:(window.Notification?Notification.permission:'unsupported')};
const THEMES=()=>[{k:'daily',n:'日常'},{k:'people',n:'身邊的人'},{k:'place',n:'所在之處'},{k:'habit',n:(S.settings&&S.settings.habit)||'習慣'}];
const themeName=k=>(THEMES().find(t=>t.k===k)||{}).n||k;

/* ---------- 視覺層（fx.js）。沒載入時退回最簡版本，App 照常可用 ---------- */
const fx=window.FX||{
  ov:{show(el){el.classList.add('show')},hide(el,done){if(!el.classList.contains('show'))return;el.classList.remove('show');done&&done()}},
  enter(){},develop(){},pulse(){},nav(){window.scrollTo(0,0)},
  navDot(v){const dot=$('#navdot'),b=document.querySelector(`#tabs button[data-v="${v}"]`);if(!dot||!b||!b.offsetWidth)return false;dot.style.transform=`translateX(${b.offsetLeft+b.offsetWidth/2-2}px)`;return true},
  photo:{mount(host,o){const img=document.createElement('img');img.alt=(o&&o.label)||'照片';host.appendChild(img);return{setImage:async s=>{img.src=s},develop(){},setProg(){},fit(){},destroy(){img.remove()}}}},
  safelight:{mount(){return null}}
};

/* ---------- IndexedDB ---------- */
const DB='xianying';
let dbp=null;
function db(){
  if(dbp) return dbp;
  dbp=new Promise((res,rej)=>{
    const r=indexedDB.open(DB,1);
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains('entries')) d.createObjectStore('entries',{keyPath:'id'});
      if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
    };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return dbp;
}
async function tx(store,mode,fn){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,mode), s=t.objectStore(store); let out;
    out=fn(s); t.oncomplete=()=>res(out&&'result' in out?out.result:out); t.onerror=()=>rej(t.error);
  });
}
const kvGet=async k=>{ try{ return await tx('kv','readonly',s=>s.get(k)) }catch{ return undefined } };
const kvSet=async (k,v)=>{ try{ await tx('kv','readwrite',s=>s.put(v,k)) }catch(e){ console.error('save failed',e) } };
const kvDel=async k=>{ try{ await tx('kv','readwrite',s=>s.delete(k)) }catch{} };
const allEntries=async()=>{ try{ return (await tx('entries','readonly',s=>s.getAll()))||[] }catch{ return [] } };
const putEntry=async e=>{ try{ await tx('entries','readwrite',s=>s.put(e)) }catch(err){ console.error('save failed',err); alert('存不進去，可能是空間不足。') } };
const delEntry=async id=>{ try{ await tx('entries','readwrite',s=>s.delete(id)) }catch{} };
const clearEntries=async()=>{ try{ await tx('entries','readwrite',s=>s.clear()) }catch{} };

async function load(){
  S.settings=await kvGet('settings')||null;
  S.entries=(await allEntries()).sort((a,b)=>a.ts-b.ts);
  S.agentLog=await kvGet('agentLog')||[];
  S.agentMeta=await kvGet('agentMeta')||{};
  await ensureMoment();
}

/* ---------- 今天的時刻 ---------- */
async function ensureMoment(){
  const k='moment:'+dkey(new Date());
  let m=await kvGet(k);
  if(!m){
    const now=new Date(), start=new Date(now), end=new Date(now);
    start.setHours(9,0,0,0); end.setHours(22,0,0,0);
    let at=null;
    if(now<end){ const lo=Math.max(now.getTime()+90e3,start.getTime()); at=Math.round(lo+Math.random()*(end.getTime()-lo)); }
    m={at,notified:false}; await kvSet(k,m);
  }
  S.moment=m;
}
const momentDone=()=>{const t=dkey(new Date());return S.entries.some(e=>e.moment&&e.date===t)};

/* 開著或剛切到背景時，時刻到了就送通知 */
async function tickMoment(){
  const m=S.moment; if(!m||!m.at||m.notified) return;
  if(Date.now()<m.at) return;
  m.notified=true; await kvSet('moment:'+dkey(new Date()),m);
  if(momentDone()) return;
  if(window.Notification&&Notification.permission==='granted'){
    try{ const reg=await navigator.serviceWorker.ready; reg.active&&reg.active.postMessage({type:'moment',day:dkey(new Date())}); }catch(e){ console.error(e) }
  }
}

let dotView=null, lastBanner='';
function bannerSig(){ const m=S.moment||{}; return momentDone()?'done':(m.at&&Date.now()>=m.at?'now':(m.at?'wait':'past')) }
/* o.enter：換頁/第一次進場才播進場動畫；其他重繪（按回饋、更新時間）一律靜默，避免一直重播 */

function weekStart(off){ const d=new Date(); d.setHours(0,0,0,0); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd+off*7); return d }
const DAYC=['一','二','三','四','五','六','日'];
const todayIdx=()=>(new Date().getDay()+6)%7;
/* 最早要顯示到哪一週：開始使用那天或最早一則紀錄，最多往回兩年 */
function minWeekOff(){
  const cur=weekStart(0).getTime();
  let first=S.settings&&S.settings.since?parseD(S.settings.since).getTime():Date.now();
  if(S.entries.length) first=Math.min(first,S.entries[0].ts);
  const d=new Date(first); d.setHours(0,0,0,0); d.setDate(d.getDate()-(d.getDay()+6)%7);
  return Math.max(-104,Math.min(0,Math.round((d.getTime()-cur)/(7*864e5))));
}
function weekRange(off){ const s=weekStart(off), e=new Date(s); e.setDate(s.getDate()+6); return `${s.getMonth()+1}/${s.getDate()} – ${e.getMonth()+1}/${e.getDate()}` }
function weekHasImg(off){ const s=weekStart(off).getTime(), e=s+7*864e5; return S.entries.some(x=>x.img&&x.ts>=s&&x.ts<e) }
/* 一格：同一天同一主題有多張時，放那天的時刻那張，沒有就放最後一張 */
function frameHTML(k,t,full){
  const es=S.entries.filter(x=>x.date===k&&x.theme===t.k);
  if(!es.length) return `<div class="frame empty" aria-label="${esc(t.n)}：沒有"><span>${esc(t.n)}</span></div>`;
  const x=es.find(y=>y.moment)||es[es.length-1], n=es.length>1?`<i class="n">${es.length}</i>`:'';
  if(!x.img) return `<button class="frame txt" data-act="full" data-id="${x.id}" aria-label="${esc(t.n)}">${esc((x.line||t.n).slice(0,24))}${n}</button>`;
  return `<button class="frame" data-act="full" data-id="${x.id}" aria-label="${esc(t.n)}${x.line?'：'+esc(x.line):''}，放大">${full?`<img src="${x.img}" alt="" decoding="async">`:''}${n}</button>`;
}
function stripsHTML(off,full){
  const s=weekStart(off), today=dkey(new Date()), now=Date.now();
  return DAYC.map((c,i)=>{
    const d=new Date(s); d.setDate(s.getDate()+i); const k=dkey(d), fut=d.getTime()>now&&k!==today;
    const frames=THEMES().map(t=>fut?`<div class="frame empty"><span>${esc(t.n)}</span></div>`:frameHTML(k,t,full)).join('');
    return `<div class="strip ${k===today?'today':''} ${fut?'future':''}" data-i="${i}" aria-label="${d.getMonth()+1}月${d.getDate()}日 週${c}">
      ${frames}<div class="foot"><b>顯影</b><span class="d">${k===today?'今天':fut?'還沒到':`${d.getMonth()+1}.${pad(d.getDate())} ${c}`}</span></div></div>`;
  }).join('');
}
function viewWeek(){
  const min=minWeekOff();
  S.weekOff=Math.max(min,Math.min(0,S.weekOff));
  if(S.dayIdx==null) S.dayIdx=todayIdx();
  let rows='';
  for(let off=min;off<=0;off++){
    const full=Math.abs(off-S.weekOff)<=1;
    rows+=`<section class="wrow" data-off="${off}"><span class="wk">${off===0?'這週':weekRange(off)}</span><div class="wtrack" data-off="${off}" data-full="${full?1:0}">${stripsHTML(off,full)}</div></section>`;
  }
  return `<div class="weekhead"><div><div class="rng" id="wkRng">${weekRange(S.weekOff)}</div><div class="hint">左右換天・上下換週</div></div>
      <div class="acts"><button class="btn" data-act="play" id="wkPlay" ${weekHasImg(S.weekOff)?'':'disabled'}>播放</button><button class="btn fill" data-act="save">存下來</button></div></div>
    <div class="wdays" id="wdays">${DAYC.map((c,i)=>`<button data-act="wday" data-i="${i}" class="${i===S.dayIdx?'on':''} ${S.weekOff===0&&i===todayIdx()?'td':''}" aria-label="週${c}">${c}</button>`).join('')}</div>
    <div class="booth" id="booth" data-lenis-prevent tabindex="-1">${rows}</div>`;
}
/* 版面：拍貼機要剛好塞滿「標題下方到分頁列上方」，頁面本身不捲 */
let boothH=0, boothStep=206;
const smooth=()=>matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
function layoutBooth(){
  const b=$('#booth'); if(!b) return;
  const top=b.getBoundingClientRect().top+scrollY, tabs=$('#tabs').offsetHeight||70;
  const H=Math.max(380,Math.round(innerHeight-top-tabs));
  const W=b.clientWidth||innerWidth;
  // 一條：上 padding 10 + 四格 + 三個間距 6 + 底下 34；上下各留 30 給週標與呼吸
  let fh=Math.floor((H-60-10-18-34)/4), fw=Math.round(fh*1.22);
  const maxW=Math.min(230,W*0.58); if(fw>maxW){ fw=Math.round(maxW); fh=Math.round(fw/1.22) }
  const sw=fw+20, gap=Math.max(14,Math.round(W*0.045));
  boothH=H; boothStep=sw+gap;
  b.style.height=H+'px';
  b.style.setProperty('--fh',fh+'px'); b.style.setProperty('--fw',fw+'px');
  b.style.setProperty('--sw',sw+'px'); b.style.setProperty('--gap',gap+'px');
}
function placeBooth(){
  const b=$('#booth'); if(!b) return;
  const min=minWeekOff();
  b.scrollTop=(S.weekOff-min)*boothH;
  b.querySelectorAll('.wtrack').forEach(t=>{ t.scrollLeft=S.dayIdx*boothStep });
}
function hydrateWeeks(){
  const b=$('#booth'); if(!b) return;
  b.querySelectorAll('.wtrack').forEach(t=>{
    const off=Number(t.dataset.off), want=Math.abs(off-S.weekOff)<=1?'1':'0';
    if(t.dataset.full!==want){ const L=t.scrollLeft; t.innerHTML=stripsHTML(off,want==='1'); t.dataset.full=want; t.scrollLeft=L }
  });
}
function syncWeekHead(){
  const r=$('#wkRng'); if(r) r.textContent=weekRange(S.weekOff);
  const p=$('#wkPlay'); if(p) p.disabled=!weekHasImg(S.weekOff);
  document.querySelectorAll('#wdays button').forEach((x,i)=>{ x.classList.toggle('on',i===S.dayIdx); x.classList.toggle('td',S.weekOff===0&&i===todayIdx()) });
}
function mountBooth(){
  const b=$('#booth'); if(!b) return;
  layoutBooth(); placeBooth();
  let vt=null;
  // 上下：換週。停下來之後才換內容，滑的過程不重排
  b.addEventListener('scroll',ev=>{
    if(ev.target===b){
      const off=minWeekOff()+Math.round(b.scrollTop/boothH);
      if(off!==S.weekOff){
        S.weekOff=off; syncWeekHead();
        const row=b.querySelector(`.wtrack[data-off="${off}"]`); if(row) row.scrollLeft=S.dayIdx*boothStep;
      }
      clearTimeout(vt); vt=setTimeout(hydrateWeeks,140);
    }else if(ev.target.classList&&ev.target.classList.contains('wtrack')&&Number(ev.target.dataset.off)===S.weekOff){
      // 左右：換天
      const i=Math.max(0,Math.min(6,Math.round(ev.target.scrollLeft/boothStep)));
      if(i!==S.dayIdx){ S.dayIdx=i; syncWeekHead() }
    }
  },{capture:true,passive:true});
}
function goDay(i){
  i=Math.max(0,Math.min(6,i)); const t=document.querySelector(`#booth .wtrack[data-off="${S.weekOff}"]`);
  if(t) t.scrollTo({left:i*boothStep,behavior:smooth()});
}
function goWeek(dir){
  const b=$('#booth'); if(!b) return; const min=minWeekOff();
  const off=Math.max(min,Math.min(0,S.weekOff+dir)); b.scrollTo({top:(off-min)*boothH,behavior:smooth()});
}
function agentReady(){ const days=new Set(S.entries.map(e=>e.date)); return S.entries.length>=6&&days.size>=3 }
function rel(ts){ const h=(Date.now()-ts)/36e5; if(h<1)return'剛剛'; if(h<24)return`${Math.floor(h)} 小時前`; return`${Math.floor(h/24)} 天前` }
function viewAgent(){
  const hasKey=!!(S.settings&&S.settings.apiKey);
  let status;
  if(S.busy) status='它在看。';
  else if(S.err) status=S.err;
  else if(!hasKey) status='還沒接上。到設定填一組 API 金鑰，它才看得了。';
  else if(!agentReady()) status='還在累積。它需要幾天的紀錄，才看得出什麼是反覆出現的。';
  else if(!S.agentMeta.lastCheck) status='還沒看過。';
  else status=`上次看是${rel(S.agentMeta.lastCheck)}。${S.agentMeta.lastSpoke?'':'那次沒有想說的。'}`;
  const prints=S.agentLog.slice().reverse().map(m=>`<div class="print"${m.id===S.freshId?' data-fresh':''}>
    <p class="txt">${esc(m.text)}</p>
    <div class="when">${new Date(m.ts).getMonth()+1}月${new Date(m.ts).getDate()}日</div>
    <div class="fb">${m.reaction?`<span class="chosen">你說：${m.reaction==='yes'?'有這回事':'不是這樣'}</span>`:
      `<button class="btn" data-act="react" data-id="${m.id}" data-r="yes">有這回事</button><button class="btn" data-act="react" data-id="${m.id}" data-r="no">不是這樣</button>`}</div>
    ${m.reply?`<div class="reply">${esc(m.reply)}</div>`:(m.reaction?`<textarea rows="1" placeholder="想補一句的話（可以不寫）" data-reply="${m.id}"></textarea><div style="margin-top:8px"><button class="link" data-act="reply" data-id="${m.id}">送出</button></div>`:'')}
  </div>`).join('');
  return `<p class="lead">它一直在看，只在真的看見什麼的時候才開口。<br>它不會告訴你該怎麼做，也不會猜你的心情。</p>
    <p class="status">${esc(status)}</p>
    <div class="row"><button class="btn" data-act="check" ${(S.busy||!agentReady()||!hasKey)?'disabled':''}>讓它看一次</button></div>
    ${prints}
    <div style="margin-top:40px"><button class="link" data-act="settings">設定</button></div>`;
}

function cdEl(){

async function compress(file){
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    const M=560, s=Math.min(1,M/Math.max(bmp.width,bmp.height));
    const w=Math.round(bmp.width*s), h=Math.round(bmp.height*s);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(bmp,0,0,w,h); bmp.close&&bmp.close();
    return cv.toDataURL('image/jpeg',.7);
  }catch{ return null }
}
async function saveCap(){
  const c=S.cap; if(!c||!c.theme) return;
  const now=new Date();
  const e={id:String(now.getTime()),ts:now.getTime(),date:dkey(now),theme:c.theme,line:c.line.trim(),img:c.img,late:(Date.now()-c.start)>120000,moment:c.moment};
  S.entries.push(e); await putEntry(e); closeCap(); S.view='today'; render();
}

let slideT=null, slideList=[], slideI=0, slideH=null, slideGen=0;

  slideList=S.entries.filter(x=>x.img&&x.ts>=s.getTime()&&x.ts<e.getTime()); if(!slideList.length) return;

async function stripDraw(g,k,x,y,o){

function systemPrompt(){
  const habit=(S.settings&&S.settings.habit)||'習慣';
  return `你是「顯影」裡的觀察者。使用者用這個 app 隨機記錄真實生活的片段（照片＋一句話），分成四個主題：日常、身邊的人、所在之處、習慣（${habit}）。你只做一件事：長期看這些紀錄，只在真的看見一個「跨越時間的模式」時才開口。

你會收到：所有紀錄的日期、星期、時段、主題、一句話（JSON），最近幾張照片（依時間排序，最後一張最新），以及你過去說過的話和使用者的回應。

怎麼決定：
1. 沒有跨時間的模式，或紀錄還太少、太短（少於一週或不到八則），就不要開口：speak=false。沉默是正常的，也是好的。多數時候你應該沉默。
2. 一則紀錄的內容不是模式。模式是「反覆出現」或「明顯改變」：同一個地方、同一個時段、同一種東西、某一天之後變得不一樣。
3. 有把握的行為模式，用「說」（mode=say）：具體指出你看到什麼，然後停下。不解釋意義，不給建議。
4. 涉及詮釋、你沒把握的，用「問」（mode=ask）：講出你注意到的，用一個問題把詮釋權交回給對方。
5. 使用者回過「不是這樣」的觀察，不要再用同一個角度。回過「有這回事」的，可以延續，但不要重複講同一件事。
6. 一次只說一件事，兩句以內。台灣的中文口語，像一個安靜、認識很久的朋友：不熱情、不鼓勵、不下結論。

絕對不做：
- 不評估或猜測心情、狀態、心理健康。不說「你好像很累／低落／迷茫／快樂」。
- 不給方向、建議、鼓勵、稱讚。不說「加油」「很棒」「繼續保持」「可以試試」。
- 不算成就。不講連續幾天、達成幾次。次數只用來描述模式（「這兩週有一半的晚上」），不當成績。
- 不跟任何人比較。
- 不用「數據」「分析」「偵測」「紀錄顯示」這類字。

只輸出 JSON，沒有其他文字、沒有 markdown 圍欄：
{"speak": true 或 false, "mode": "say" 或 "ask", "text": "要說的話；speak=false 時為空字串", "why": "一句話給你自己的備註"}`;
}

  S.busy=true; S.err=''; render();
  try{
    const log=S.entries.map(e=>({d:e.date,w:'週'+WD[parseD(e.date).getDay()],h:new Date(e.ts).getHours(),t:themeName(e.theme),l:e.line||'',late:!!e.late,moment:!!e.moment}));
    const imgs=S.entries.filter(e=>e.img).slice(-10).map(e=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:e.img.split(',')[1]}}));
    const past=S.agentLog.map(m=>({when:new Date(m.ts).toISOString().slice(0,10),mode:m.mode,said:m.text,reaction:m.reaction||null,reply:m.reply||''}));
    const payload={today:dkey(new Date()),habit:(S.settings&&S.settings.habit)||'',entries:log,past_observations:past};
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:systemPrompt(),messages:[{role:'user',content:[...imgs,{type:'text',text:JSON.stringify(payload)}]}]})});
    const data=await res.json();
    if(data.error) throw new Error(data.error.message||'api');
    const text=(data.content||[]).map(b=>b.type==='text'?b.text:'').join('').replace(/```json|```/g,'').trim();
    const out=JSON.parse(text);
    S.agentMeta={lastCheck:Date.now(),lastCount:S.entries.length,lastSpoke:!!(out.speak&&out.text)};
    if(out.speak&&out.text){ S.freshId=String(Date.now()); S.agentLog.push({id:S.freshId,ts:Date.now(),mode:out.mode||'say',text:String(out.text).trim(),reaction:null,reply:''}); await kvSet('agentLog',S.agentLog) }
    await kvSet('agentMeta',S.agentMeta);
  }catch(e){ console.error(e); S.err='它這次沒看清楚（連線或金鑰出了問題）。等一下再讓它看一次。' }
  S.busy=false; render();
}
function maybeAutoRun(){
  if(!agentReady()||S.busy||!(S.settings&&S.settings.apiKey)) return;
  const m=S.agentMeta, fresh=m.lastCheck&&(Date.now()-m.lastCheck)<20*36e5;
  if(!fresh&&S.entries.length>(m.lastCount||0)) runAgent();
}

/* ---------- 事件 ---------- */
document.addEventListener('click',async ev=>{
  const a=ev.target.closest('[data-act]'); if(!a) return;
  const d=a.dataset;
  switch(d.act){
    case 'onboard':{ const h=($('#habit').value||'健身').trim().slice(0,8)||'健身'; S.settings={habit:h,since:dkey(new Date()),apiKey:''}; await kvSet('settings',S.settings); render({enter:true}); break }
    case 'nav': if(d.v!==S.view){ S.view=d.v; render({enter:true,nav:true}); dotView=d.v } fx.nav(d.v); if(d.v==='agent') maybeAutoRun(); break;
    case 'install': if(S.installEvt){ S.installEvt.prompt(); await S.installEvt.userChoice; S.installEvt=null; render() } break;
    case 'asknotif': try{ S.notif=await Notification.requestPermission() }catch{} render(); break;
    case 'cap':{ const r=a.getBoundingClientRect(); openCap(d.theme||null,d.moment==='1',{x:Math.round(r.left+r.width/2),y:Math.round(r.top+r.height/2)}); break }
    case 'theme': S.cap.theme=d.k; S.cap.line=$('[data-line]').value; renderCap(); break;
    case 'capclose': closeCap(); break;
    case 'capsave': S.cap.line=$('[data-line]').value; await saveCap(); break;
    case 'open':{ const r=a.getBoundingClientRect(); openEntry(d.id,{x:Math.round(r.left+r.width/2),y:Math.round(r.top+r.height/2)}); break }
    case 'wday': goDay(Number(d.i)); break;
    case 'full': openFull(d.id,a); break;
    case 'fullsib': openFull(d.id); break;
    case 'fullclose': closeFull(); break;
    case 'fulldel':{ if(!confirm('刪掉這一則？')) break; S.entries=S.entries.filter(x=>x.id!==d.id); await delEntry(d.id); closeFull(true); render(); break }
    case 'save': openSave(); break;
    case 'expkind': S.exp=d.k; buildExport(); break;
    case 'expsave': saveExport(); break;
    case 'expclose': closeSave(); break;
    case 'eclose': closeEntry(); break;
    case 'edel':{ if(!confirm('刪掉這一則？')) break; S.entries=S.entries.filter(x=>x.id!==d.id); await delEntry(d.id); closeEntry(); render(); break }
    case 'play': playWeek(); break;
    case 'check': runAgent(); break;
    case 'react':{ const m=S.agentLog.find(x=>x.id===d.id); if(m){ m.reaction=d.r; await kvSet('agentLog',S.agentLog); render() } break }
    case 'reply':{ const m=S.agentLog.find(x=>x.id===d.id); const ta=document.querySelector(`[data-reply="${d.id}"]`); if(m&&ta&&ta.value.trim()){ m.reply=ta.value.trim().slice(0,200); await kvSet('agentLog',S.agentLog) } render(); break }
    case 'settings': openSettings(); break;
    case 'setclose': fx.ov.hide($('#ovSet')); break;
    case 'setsave':{ S.settings=Object.assign({},S.settings,{habit:($('#setHabit').value||'習慣').trim().slice(0,8)||'習慣',apiKey:$('#setKey').value.trim()});
      await kvSet('settings',S.settings); fx.ov.hide($('#ovSet')); render(); break }
    case 'export':{ const blob=new Blob([JSON.stringify({entries:S.entries,agentLog:S.agentLog},null,2)],{type:'application/json'});
      const u=URL.createObjectURL(blob), a2=document.createElement('a'); a2.href=u; a2.download='顯影-'+dkey(new Date())+'.json'; a2.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); break }
    case 'reset':{ if(!confirm('清掉所有紀錄與它說過的話？這無法復原。')) break;
      await clearEntries(); await kvDel('agentLog'); await kvDel('agentMeta'); await kvDel('settings');
      for(let i=0;i<400;i++){ const dd=new Date(); dd.setDate(dd.getDate()-i); await kvDel('moment:'+dkey(dd)) }
      S.entries=[]; S.agentLog=[]; S.agentMeta={}; S.settings=null; S.view='today';
      fx.ov.hide($('#ovSet')); await ensureMoment(); render(); break }
  }
});
document.addEventListener('change',async ev=>{
  if(ev.target.matches('[data-file]')&&S.cap){ const f=ev.target.files&&ev.target.files[0]; if(!f) return; S.cap.line=$('[data-line]').value; S.cap.img=await compress(f); renderCap() }
});
document.addEventListener('input',ev=>{ if(ev.target.matches('[data-line]')&&S.cap) S.cap.line=ev.target.value });
$('#ovSlide').addEventListener('click',closeSlide);
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){ closeSlide(); closeEntry(); closeFull(); closeSave(); fx.ov.hide($('#ovSet')); if(S.cap) closeCap(); return }
  // 這週：方向鍵也能翻（桌面用）
  if(S.view!=='week'||document.querySelector('.ov.show')||/INPUT|TEXTAREA/.test((ev.target||{}).tagName||'')) return;
  const k={ArrowLeft:()=>goDay(S.dayIdx-1),ArrowRight:()=>goDay(S.dayIdx+1),ArrowUp:()=>goWeek(-1),ArrowDown:()=>goWeek(1)}[ev.key];
  if(k){ ev.preventDefault(); k() }
});
let rsT=null;
window.addEventListener('resize',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ if(S.view==='week'&&$('#booth')){ layoutBooth(); placeBooth() } },120) });

window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); S.installEvt=e; if(S.settings&&S.view==='today') render() });
document.addEventListener('visibilitychange',async()=>{ if(!document.hidden){ S.dayKey=dkey(new Date()); await ensureMoment(); if(!S.cap) render() } });
/* 每 20 秒檢查一次；只有「時刻狀態」或日期真的變了才重繪，不再整頁無謂重畫 */
setInterval(async()=>{
  await tickMoment();
  $('#hdate').textContent=fmtDate(new Date());
  if(dkey(new Date())!==S.dayKey){ S.dayKey=dkey(new Date()); await ensureMoment(); if(!S.cap) render(); return }
  if(S.view==='today'&&S.settings&&!S.cap&&bannerSig()!==lastBanner) render();
},20000);

if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.error('sw',e))) }
load().then(()=>{ render({enter:true}); tickMoment() });
</script>
</body>
