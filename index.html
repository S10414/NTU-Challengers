<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revela</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#EBC4B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Revela">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./vendor/lenis.css">
<link rel="preload" href="./vendor/fraunces-600.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:"Fraunces";font-style:normal;font-weight:600;font-display:swap;src:url(./vendor/fraunces-600.woff2) format("woff2")}
  :root{
    /* 霧桃粉 → 米白 */
    --sky:#EBC4B8; --haze:#F3D6CA; --horizon:#FAF1E6; --field:#FAF1E6;
    --dusk:linear-gradient(180deg,var(--sky) 0%,var(--haze) 38%,var(--horizon) 100%);
    --card:#F7E6DA; --paper:#FCF7EF; --paper-2:#F3DDD0; --glass:rgba(252,247,239,.7);
    --ink:#2B211C; --ink-2:#56443A; --ink-3:#6A584C; --dark:#2B221D;
    --safe:#D9917E; --line:rgba(43,33,28,.12);
    --word:"Fraunces","Noto Serif TC",Georgia,serif;
    --serif:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{background:var(--card)}
  body{background:var(--dusk) fixed}
  html,body{margin:0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  img{display:block}

  /* 視覺層：黃昏天空、拍攝時的日落、照片浮現 */
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s ease}
  #bg.on{opacity:1}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .fx-photo{display:block;opacity:0;max-width:100%}
  .fx-safe{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

  #app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  header.top{display:flex;align-items:baseline;justify-content:space-between;padding:max(22px,env(safe-area-inset-top)) 22px 10px}
  header.top h1{font-family:var(--word);font-weight:600;font-size:25px;letter-spacing:.005em;margin:0}
  header.top .date{font-size:13px;color:var(--ink-2)}
  main{flex:1;padding:6px 22px 110px}

  nav.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;
    display:flex;background:rgba(246,234,222,.72);-webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);border-top:1px solid var(--line);
    padding:8px 10px max(14px,env(safe-area-inset-bottom))}
  nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 14px;font-size:14px;color:var(--ink-3);position:relative;letter-spacing:.04em}
  nav.tabs button.on{color:var(--ink)}
  #navdot{position:absolute;left:0;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 6px);width:4px;height:4px;border-radius:50%;background:var(--ink);pointer-events:none}

  .paper{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:14px 16px;border-radius:4px;box-shadow:0 1px 0 rgba(43,33,28,.10),0 0 0 1px rgba(255,255,255,.35) inset;margin-bottom:10px}
  .muted{color:var(--ink-2)} .small{font-size:13px}
  p.lead{font-family:var(--serif);font-size:17px;line-height:1.85;margin:6px 0 14px}

  .btn{display:inline-block;padding:11px 16px;border:1px solid var(--ink);background:transparent;border-radius:2px;font-size:15px;line-height:1;text-align:center}
  .btn.fill{background:var(--ink);color:var(--paper)}
  .btn.wide{width:100%;padding:14px 16px}
  .btn:disabled{opacity:.45;cursor:default}
  .link{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:13px}

  .notice{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-left:2px solid var(--safe);padding:12px 14px;margin:0 0 14px;font-size:14px;line-height:1.7;color:var(--ink-2)}
  .notice .btn{margin-top:10px;padding:9px 14px;font-size:14px}

  .agent-foot{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--ink-3)}
  .moment{border-radius:3px;margin:8px 0 18px;text-align:left;width:100%;border:0}
  .moment.wait{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:16px}
  .moment.wait .t{font-family:var(--serif);font-size:18px;margin:0 0 4px}
  .moment.now{background:var(--safe);color:var(--paper);padding:26px 18px 22px;box-shadow:0 8px 24px rgba(120,52,32,.28)}
  .moment.now .t{font-family:var(--serif);font-size:30px;letter-spacing:.06em;margin:0 0 6px;font-weight:600}
  .moment.now .s{font-size:14px;opacity:.9}
  .moment.done{background:rgba(232,217,203,.7);padding:14px 16px;color:var(--ink-2);font-family:var(--serif);font-size:16px}
  .row{display:flex;gap:10px;align-items:center;margin:0 0 18px}
  .entry{display:flex;gap:12px;align-items:flex-start}
  .entry .th{width:64px;height:64px;flex:none;background:var(--paper-2);border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .entry .th img{width:100%;height:100%;object-fit:cover}
  .entry .line{font-family:var(--serif);font-size:16px;line-height:1.6;margin:0 0 4px}
  .entry .meta{font-size:12px;color:var(--ink-3)}
  .entry button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;width:100%}
  .empty{font-family:var(--serif);color:var(--ink-2);font-size:16px;line-height:1.8;padding:10px 0}

  /* 這週：拍貼機。一天一條四格，左右換天、上下換週 */
  main.v-week{padding-bottom:0}
  .weekhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 10px}
  .weekhead .rng{font-family:var(--serif);font-size:19px;letter-spacing:.02em}
  .weekhead .hint{font-size:12px;color:var(--ink-2);margin-top:3px}
  .weekhead .btn{padding:9px 13px;font-size:14px;flex:none}
  .wdays{display:flex;justify-content:space-between;margin:0 0 4px}
  .wdays button{flex:1;background:none;border:0;padding:6px 0 8px;font-family:var(--serif);font-size:14px;color:var(--ink-2);position:relative}
  .wdays button.on{color:var(--ink);font-weight:600}
  .wdays button.on::after{content:"";position:absolute;left:50%;bottom:2px;width:14px;height:2px;margin-left:-7px;background:var(--ink)}
  .wdays button.td{color:#8E3B27}
  .booth{margin:0 -22px;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .booth::-webkit-scrollbar,.wtrack::-webkit-scrollbar{display:none}
  .wrow{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative}
  .wrow .wk{position:absolute;left:22px;top:6px;font-size:11px;letter-spacing:.06em;color:var(--ink-3)}
  .wtrack{height:100%;display:flex;align-items:center;gap:var(--gap,16px);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
    overscroll-behavior-x:contain;scrollbar-width:none;padding:0 calc(50% - var(--sw,190px) / 2)}
  .strip{flex:none;width:var(--sw,190px);scroll-snap-align:center;scroll-snap-stop:always;background:var(--paper);padding:10px 10px 0;
    box-shadow:0 1px 0 rgba(90,60,40,.18),0 10px 26px rgba(90,60,40,.18);display:flex;flex-direction:column;gap:6px;transition:opacity .3s}
  .strip.future{opacity:.42}
  .frame{touch-action:manipulation;-webkit-tap-highlight-color:transparent;width:var(--fw,170px);height:var(--fh,140px);background:var(--dark);border:0;padding:0;overflow:hidden;position:relative;display:block}
  .frame img{width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(1.02)}
  .frame.empty{background:var(--paper-2);cursor:default}
  .frame.empty span{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--ink-3);letter-spacing:.04em}
  .frame.txt{background:var(--dark);color:var(--paper);font-family:var(--serif);font-size:13px;line-height:1.5;text-align:left;padding:10px;display:flex;align-items:flex-end}
  .frame .n{position:absolute;right:6px;top:6px;background:rgba(250,243,234,.92);color:var(--ink);font-size:11px;padding:1px 6px;border-radius:999px}
  .strip .foot{height:34px;display:flex;align-items:center;justify-content:space-between;font-family:var(--serif);font-size:12px;color:var(--ink-2)}
  .strip .foot b{font-family:var(--word);font-weight:600;font-size:13px;letter-spacing:.01em;color:var(--ink)}
  .strip.today .foot .d{color:var(--safe);font-weight:600}
  /* 滿版：從格子放大 */
  .ov.full{background:transparent;overflow:hidden}
  .ov.full .bd{position:absolute;inset:0;background:#120E0C}
  .ov.full .ph{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-out}
  .ov.full .ph.txt{display:flex;align-items:center;justify-content:center;padding:40px 32px;font-family:var(--serif);font-size:24px;line-height:1.8;color:var(--paper);background:var(--dark);overflow:hidden}
  .ov.full .fbar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:baseline;padding:max(20px,env(safe-area-inset-top)) 22px 40px;background:linear-gradient(rgba(0,0,0,.55),transparent);color:var(--paper);pointer-events:none}
  .ov.full .fbar>*{pointer-events:auto}
  .ov.full .fbar .t{font-family:var(--serif);letter-spacing:.08em;font-size:16px}
  .ov.full .link{color:var(--paper);opacity:.9}
  .ov.full .info{position:absolute;left:0;right:0;bottom:0;padding:56px 22px max(24px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7));color:var(--paper)}
  .ov.full .info .line{font-family:var(--serif);font-size:20px;line-height:1.6;margin:0 0 6px}
  .ov.full .info .meta{font-size:13px;opacity:.8;margin-bottom:14px}
  .ov.full .sibs{margin:0 0 14px}
  /* 存下來 */
  .ov.save{background:var(--ink);color:var(--paper)}
  .ov.save .link{color:var(--paper);opacity:.85}
  .ov.save h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0}
  .seg{display:flex;gap:8px;margin:18px 0 16px}
  .seg button{flex:1;background:transparent;border:1px solid rgba(250,243,234,.45);color:var(--paper);border-radius:999px;padding:9px 4px;font-size:14px}
  .seg button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .expv{display:flex;justify-content:center;margin:0 0 16px}
  .expv .pv{height:min(58vh,560px);aspect-ratio:9/16;background:var(--dark);display:flex;align-items:center;justify-content:center;color:rgba(250,243,234,.6);font-family:var(--serif);font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .expv img{height:100%;width:100%;object-fit:contain;display:block}
  .ov.save .btn.paper{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .ov.save .note{font-size:12px;opacity:.65;margin-top:10px;text-align:center;line-height:1.6}
  .weekhead .acts{display:flex;gap:8px;flex:none}
  .sibs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-12px 0 24px;font-size:13px;opacity:.85}
  .sibs button{width:44px;height:44px;padding:0;border:2px solid transparent;background:#000;overflow:hidden}
  .sibs button.on{border-color:var(--paper)}
  .sibs img{width:100%;height:100%;object-fit:cover}

  .print{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:18px 18px 14px;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.05);margin-bottom:14px}
  .print .txt{font-family:var(--serif);font-size:18px;line-height:1.85;margin:0 0 10px}
  .print .when{font-size:12px;color:var(--ink-3);margin-bottom:12px}
  .print .fb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .print .fb .btn{padding:8px 12px;font-size:13px}
  .print .fb .chosen{font-size:13px;color:var(--ink-2)}
  .print textarea{width:100%;margin-top:10px;background:transparent;border:0;border-bottom:1px solid var(--ink-3);padding:6px 0;resize:none;font-family:var(--serif);font-size:15px;line-height:1.6}
  .print .reply{font-family:var(--serif);font-size:15px;color:var(--ink-2);margin-top:10px;padding-left:10px;border-left:2px solid var(--ink-3)}
  .consent h2{font-family:var(--serif);font-size:24px;font-weight:600;margin:28px 0 6px}
  .consent .sub{font-size:14px;color:var(--ink-2);margin:0 0 18px;line-height:1.7}
  .consent h3{font-size:15px;font-weight:600;margin:22px 0 6px}
  .consent p,.consent li{font-size:14px;line-height:1.8;color:var(--ink-2);margin:0 0 6px}
  .consent ul{padding-left:18px;margin:0 0 6px}
  .opt{display:flex;gap:12px;align-items:flex-start;padding:14px 0 0;cursor:pointer}
  .optw{border-top:1px solid var(--line);padding-bottom:12px}
  .optw:last-of-type{border-bottom:1px solid var(--line)}
  .more{margin:6px 0 0 34px}
  .more summary{list-style:none;cursor:pointer;font-size:13px;color:var(--ink-3);display:inline-block;padding:4px 0}
  .more summary::-webkit-details-marker{display:none}
  .more summary::after{content:' ⌄';display:inline-block;transition:transform .2s}
  .more[open] summary::after{transform:rotate(180deg)}
  .more p{font-size:13px!important;line-height:1.75!important;margin:6px 0 4px!important}
  .more ul{font-size:13px;line-height:1.75;color:var(--ink-2);padding-left:18px;margin:4px 0}
  .more h4{font-size:13px;font-weight:600;margin:10px 0 2px;color:var(--ink-2)}
  .more.foot{margin:16px 0 0}
  .linkrow{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px}
  .opt input{width:22px;height:22px;flex:none;margin:2px 0 0;accent-color:var(--ink)}
  .opt b{display:block;font-size:15px;font-weight:600;margin-bottom:2px}
  .opt span{font-size:13px;line-height:1.6;color:var(--ink-2)}
  .consent .codein,#view.v-settings .codein{width:100%;background:var(--glass);border:1px solid var(--line);border-radius:2px;padding:11px 12px;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
  .capnote{font-size:12px;line-height:1.6;color:var(--ink-2);margin:-4px 0 12px}
  .agent-sec{margin-top:36px}
  .agent-sec h2{font-family:var(--serif);font-size:16px;font-weight:600;margin:0 0 12px;letter-spacing:.1em;color:var(--ink-2)}
  .agent-sec .lead{font-size:15px;color:var(--ink-2);margin:0 0 10px}
  .status{font-family:var(--serif);font-size:16px;line-height:1.8;color:var(--ink-2);margin:0 0 14px}

  .ov{position:fixed;inset:0;z-index:50;overflow:auto;display:none}
  .ov.show{display:block}
  .ov .in{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(22px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom))}
  .ov.cap{background:var(--dusk);color:var(--ink)}
  .ov.cap .in{position:relative;z-index:1}
  .ov.cap .top{display:flex;justify-content:space-between;align-items:baseline}
  .ov.cap .top .link{color:var(--ink-2)}
  .ov.cap .now{font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:.1em;margin:26px 0 0}
  .ov.cap .cd{font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.08em;color:var(--ink-2)}
  .ov.cap .latemsg{font-size:14px;color:var(--ink-2);min-height:20px;margin:6px 0 18px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}
  .chip{background:rgba(255,250,240,.38);border:1px solid rgba(43,33,28,.45);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px}
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .camlab{display:block;background:rgba(255,250,240,.42);border:1px solid rgba(43,33,28,.5);border-radius:2px;padding:16px;text-align:center;font-size:16px;cursor:pointer;margin-bottom:14px}
  .camlab input{position:absolute;width:1px;height:1px;opacity:0}
  .camrow{display:flex;gap:10px}.camrow .camlab{flex:1;padding:16px 8px}
  .frame.empty.add{cursor:pointer}
  .frame.empty.add::after{content:'+';position:absolute;right:9px;top:4px;font-size:20px;line-height:1;color:var(--ink-3);opacity:.7}
  .prev{background:rgba(255,250,240,.4);margin-bottom:14px;max-height:42vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .prev img{max-width:100%;max-height:42vh;object-fit:contain}
  .ov.cap input.line{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(43,33,28,.5);padding:10px 0;font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:22px}
  .ov.cap input.line::placeholder{color:rgba(43,33,28,.5)}
  .ov.cap .btn.paper{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .ov.cap .btn.paper:disabled{opacity:.45}
  /* 內建相機（像 BeReal：直式 3:4 取景框、白色快門、左邊相簿、右邊翻轉） */
  .ov.cap.camon{background:#0F0C0B;color:#FAF3EA}
  .camui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;max-width:430px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom))}
  .camui .bar{width:100%;display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 6px}
  .camui .bar .cd{font-size:15px;color:#FAF3EA;letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .camui .bar .ttl{font-family:var(--serif);font-size:16px;letter-spacing:.14em}
  .camui .x{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;font-size:22px;line-height:1;color:#FAF3EA}
  .vf{position:relative;width:100%;aspect-ratio:3/4;max-height:calc(100dvh - 200px);border-radius:22px;overflow:hidden;background:#1A1513;margin-top:6px}
  .vf video{width:100%;height:100%;object-fit:cover;display:block}
  .vf video.mirror{transform:scaleX(-1)}
  .vf .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:14px;line-height:1.7;color:rgba(250,243,234,.8)}
  .vf .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .vf .flash.go{animation:shot .45s ease-out}
  @keyframes shot{0%{opacity:.9}100%{opacity:0}}
  .camctl{width:100%;flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 18px;min-height:120px}
  .camctl .side{all:unset;cursor:pointer;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(250,243,234,.12);color:#FAF3EA;font-size:12px;letter-spacing:.04em;position:relative;overflow:hidden}
  .camctl .side input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .camctl .side svg{width:24px;height:24px}
  .shutter{all:unset;cursor:pointer;width:80px;height:80px;border-radius:50%;border:5px solid #FAF3EA;box-sizing:border-box;display:grid;place-items:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .shutter::after{content:'';width:62px;height:62px;border-radius:50%;background:#FAF3EA;transition:transform .12s}
  .shutter:active::after{transform:scale(.88)}
  .shutter:disabled{opacity:.4}
  .ov.cap .prev{border-radius:16px;overflow:hidden;background:rgba(43,33,28,.08)}
  .ov.cap .again{display:flex;gap:18px;margin:-4px 0 18px}
  .ov.cap .again .link{color:var(--ink-2);position:relative}
  .ov.cap .again input{position:absolute;inset:0;opacity:0;width:100%}

  .ov.dark{background:var(--ink);color:var(--paper)}
  .ov.dark .link{color:var(--paper);opacity:.8}
  .ov.dark .big{margin:18px 0;padding:10px;display:flex;justify-content:center}
  .ov.dark .big .fx-photo,.ov.dark .big .fx-photo-fb{box-shadow:0 0 0 10px var(--paper)}
  .ov.dark .big img{width:100%;max-height:62vh;object-fit:contain;background:#000}

  .mk .strip i.f{opacity:1}
  .mk .obs{background:var(--paper);border-radius:4px;padding:12px;margin-top:40px;box-shadow:0 4px 12px rgba(43,33,28,.12)}
  .mk .obs small{display:block;font-size:8px;color:var(--ink-2);margin-bottom:6px}
  .mk .obs p{font-family:var(--serif);font-size:12px;line-height:1.7;margin:0;min-height:60px}

  /* 習慣節奏 */

  .habit .hmsg .hd{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-left:6px}

  .row2{display:flex;gap:8px;align-items:center}

  /* ---------- v28 手感與圓角 ----------
     圓角分三層：按鈕和單行輸入框最圓（膠囊）、卡片中等、照片最小 */
  :root{--r-pill:999px;--r-card:18px;--r-box:14px;--r-photo:10px;--spring:cubic-bezier(.34,1.56,.64,1)}

  /* 1. 按下去微微縮小、放開彈回來 */
  .btn,.chip,.link,.camlab,.frame.add,.seg button,.hsay,nav.tabs button{
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
    transition:transform .38s var(--spring),background-color .2s,color .2s,border-color .2s,opacity .2s}
  .btn:active:not(:disabled),.chip:active,.link:active,.camlab:active,.frame.add:active,.seg button:active,.hsay:active{transform:scale(.96);transition-duration:.08s}
  /* 切換分頁：選到的那個彈一下 */
  @keyframes tabpop{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
  nav.tabs button.on{animation:tabpop .5s var(--spring)}

  /* 2. 輸入框：膠囊形，點進去時邊框和底色慢慢變 */
  .ov.cap input.line,.habit .hline input,#view.v-settings .row2 input,.bk .row2 input,
  .consent .codein,#view.v-settings .codein,.onb input,.ob-habit input{
    background:rgba(255,250,240,.55);border:1px solid var(--line);border-radius:var(--r-pill);
    padding:12px 18px;transition:border-color .2s,background-color .2s,box-shadow .2s;outline:none}
  .ov.cap input.line{font-size:17px}
  .onb input,.ob-habit input{font-size:19px}
  .print textarea,.pnote{background:rgba(255,250,240,.55);border:1px solid var(--line);border-radius:var(--r-box);
    padding:10px 14px;transition:border-color .2s,background-color .2s,box-shadow .2s;outline:none}
  .ov.cap input.line:focus,.habit .hline input:focus,#view.v-settings .row2 input:focus,.bk .row2 input:focus,
  .consent .codein:focus,#view.v-settings .codein:focus,.onb input:focus,.ob-habit input:focus,.print textarea:focus,.pnote:focus{
    border-color:var(--ink);background:var(--paper);box-shadow:0 0 0 4px rgba(43,33,28,.07)}
  /* 有打字，旁邊的按鈕才亮 */
  .hline:has(input:placeholder-shown) .btn,.row2:has(input:placeholder-shown) .btn,
  .print:has(textarea[data-reply]:placeholder-shown) [data-act=reply]{opacity:.35;pointer-events:none}

  /* 3. 圓角 */
  .btn,.habit .hadd,.weekhead .btn,.notice .btn,.print .fb .btn,.peer .fb .btn{border-radius:var(--r-pill)}
  .paper,.print,.moment{border-radius:var(--r-card)}
  .notice{border-radius:var(--r-box);border-left:0;box-shadow:inset 0 0 0 1px var(--line)}
  .camlab,.hcmp,.pcare{border-radius:var(--r-box)}
  .strip{border-radius:var(--r-box)}
  .frame,.htile,.entry .th,.ob-pile .ph,.mk .row i{border-radius:var(--r-photo)}

  /* ---------- v29 照片當主角 ---------- */
  /* 今天頁：有照片的紀錄放大，不用卡片，靠留白分隔 */
  .entry.post{display:block;margin:0 0 26px}
  .entry.post button{display:block}
  .entry.post .ph{aspect-ratio:4/5;border-radius:var(--r-photo);overflow:hidden;background:var(--paper-2);margin-bottom:10px}
  .entry.post .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .entry.post .line{font-size:17px;margin:0 0 2px}
  .entry.note{display:block;border-top:1px solid var(--line);padding:12px 0;margin:0 0 6px}
  .entry.note button{display:block}
  /* 這週：沒拍的格子變安靜，只留一個很淡的＋ */
  .frame.empty{background:rgba(243,226,214,.45)}
  .frame.empty span{display:none}
  .frame.empty.add::after{left:50%;right:auto;top:50%;transform:translate(-50%,-50%);font-size:18px;opacity:.3}
  /* 分頁：線條圖示 + 文字 */
  nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
  nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- v30 月曆、設定移到右上角、設定分組 ---------- */
  header.top{align-items:center}
  header.top .hr{display:flex;align-items:center;gap:10px}
  .gear{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2);-webkit-tap-highlight-color:transparent;transition:transform .38s var(--spring),background-color .2s}
  .gear:active{transform:scale(.9);transition-duration:.08s}
  .gear.on{background:var(--glass);color:var(--ink)}
  .gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
  #navdot{transition:opacity .2s}
  /* 月曆 */
  .month{margin:0 0 30px}
  .mhead{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 12px}
  .mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .mwk{margin-bottom:6px}
  .mwk span{text-align:center;font-size:11px;color:var(--ink-3)}
  .mday{all:unset;box-sizing:border-box;position:relative;aspect-ratio:3/4;border-radius:8px;background:rgba(243,226,214,.45);overflow:hidden;cursor:pointer;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .38s var(--spring)}
  .mday:active:not(:disabled){transform:scale(.94);transition-duration:.08s}
  .mday:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .mday img{width:100%;height:100%;object-fit:cover;display:block}
  .mday .dn{position:absolute;left:5px;top:3px;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .mday.has .dn{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
  .mday .mn{position:absolute;right:4px;bottom:4px;background:rgba(250,243,234,.92);color:var(--ink);font-size:10px;line-height:1.5;padding:0 5px;border-radius:999px}
  .mday.dot::after{content:'';position:absolute;left:50%;bottom:8px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ink-2)}
  .mday.td{box-shadow:inset 0 0 0 1.5px var(--ink)}
  .mday.off{opacity:.35;cursor:default}
  /* 設定：分組面板 */
  #view.v-settings .sgrp{margin:16px 0 0;padding:14px 16px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:var(--r-card)}
  #view.v-settings .sgrp h3{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);margin:0 0 10px}
  #view.v-settings .sgrp p{font-size:14px;line-height:1.75;color:var(--ink-2);margin:0 0 10px}
  #view.v-settings .slabel{color:var(--ink);margin:4px 0 8px}
  #view.v-settings .sgrp .chips{margin-bottom:4px}
  .srow{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .sgrp h3+.srow,.sgrp span[hidden]+.srow{border-top:0;padding-top:2px}
  .srow b{display:block;font-weight:500;font-size:15px;color:var(--ink)}
  .srow small{display:block;font-size:12px;line-height:1.6;color:var(--ink-2);margin-top:2px}
  .sw{flex:none;width:44px;height:26px;border-radius:999px;background:rgba(43,33,28,.2);position:relative;transition:background-color .2s}
  .sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .32s var(--spring)}
  .sw.on{background:var(--ink)}
  .sw.on::after{transform:translateX(18px)}
  .chev{font-style:normal;font-size:22px;line-height:1;color:var(--ink-3)}
  .danger .drow{all:unset;box-sizing:border-box;display:block;width:100%;padding:12px 0;border-top:1px solid var(--line);color:#A8432C;font-size:15px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .danger h3+.drow{border-top:0;padding-top:2px}
  .sver{font-size:12px;color:var(--ink-3);text-align:center;margin:20px 0 0}

  /* ---------- v31 沒有照片的格子（習慣打卡、純文字）：淺色紙卡，不再是全黑 ---------- */
  .frame.txt{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);
    display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:3px;padding:10px;text-align:left}
  .frame.txt .tk{position:absolute;left:9px;top:9px;width:20px;height:20px;border-radius:50%;background:var(--ink-2)}
  .frame.txt .tk::after{content:'';position:absolute;left:7px;top:4px;width:5px;height:9px;border:solid var(--paper);border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
  .frame.txt b{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-2)}
  .frame.txt em{font-style:normal;font-family:var(--serif);font-size:13px;line-height:1.45;color:var(--ink)}

  /* ---------- v32 留下此刻按鈕、打卡印章 ---------- */
  .btn.capmain{background:var(--safe);border-color:var(--safe);color:#FFF8F2;height:64px;padding:0 20px;border-radius:20px;
    font-size:18px;font-weight:600;letter-spacing:.14em;box-shadow:0 8px 20px rgba(120,52,32,.22)}
  /* 這週：沒照片的習慣打卡 → 紙色格子中間斜蓋一個印章；有照片的打卡 → 照片角落蓋小印章 */
  .frame.stamp{background:var(--paper);display:grid;place-items:center;padding:0}
  /* 印章：雙圈、裡面淡淡的印泥色，上面勾、中間習慣名稱、下面日期，再蓋一層印泥斑點 */
  .frame.stamp .st{position:relative;width:62px;height:62px;border-radius:50%;border:2.2px solid var(--safe);background:rgba(217,145,126,.13);color:var(--safe);

<script>
/* ---------- 基本 ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const WD=['日','一','二','三','四','五','六'];
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>`${d.getMonth()+1}月${d.getDate()}日 週${WD[d.getDay()]}`;
const fmtTime=ts=>{const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

const S={view:'today',entries:[],agentLog:[],agentMeta:{},settings:null,moment:null,cap:null,
         weekOff:0,dayIdx:null,busy:false,err:'',freshId:null,dayKey:dkey(new Date()),installEvt:null,notif:(window.Notification?Notification.permission:'unsupported')};
const THEMES=()=>[{k:'daily',n:'日常'},{k:'people',n:'身邊的人'},{k:'place',n:'所在之處'},{k:'habit',n:(S.settings&&S.settings.habit)||'習慣'}];
const themeName=k=>(THEMES().find(t=>t.k===k)||{}).n||k;

/* ---------- 視覺層（fx.js）。沒載入時退回最簡版本，App 照常可用 ---------- */
const fx=window.FX||{
  ov:{show(el){el.classList.add('show')},hide(el,done){if(!el.classList.contains('show'))return;el.classList.remove('show');done&&done()}},
  enter(){},develop(){},pulse(){},flow(){},sky(){},calm(){},tilt(){return Promise.resolve(false)},tiltSupported:false,nav(){window.scrollTo(0,0)},
  navDot(v){const dot=$('#navdot'),b=document.querySelector(`#tabs button[data-v="${v}"]`);if(!dot||!b||!b.offsetWidth)return false;dot.style.transform=`translateX(${b.offsetLeft+b.offsetWidth/2-2}px)`;return true},
  photo:{mount(host,o){const img=document.createElement('img');img.alt=(o&&o.label)||'照片';host.appendChild(img);return{setImage:async s=>{img.src=s},develop(){},setProg(){},fit(){},destroy(){img.remove()}}}},
  safelight:{mount(){return null}}
};

/* ---------- IndexedDB ---------- */
const DB='xianying';
let dbp=null;
function db(){
  if(dbp) return dbp;
  dbp=new Promise((res,rej)=>{
    const r=indexedDB.open(DB,2);
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains('entries')) d.createObjectStore('entries',{keyPath:'id'});
      if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');   // 原圖（Blob），key = entry id
    };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return dbp;
}
async function tx(store,mode,fn){
  const d=await db();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,mode), s=t.objectStore(store); let out;
    out=fn(s); t.oncomplete=()=>res(out&&'result' in out?out.result:out); t.onerror=()=>rej(t.error);
  });
}
const kvGet=async k=>{ try{ return await tx('kv','readonly',s=>s.get(k)) }catch{ return undefined } };
const kvSet=async (k,v)=>{ try{ await tx('kv','readwrite',s=>s.put(v,k)) }catch(e){ console.error('save failed',e) } };
const kvDel=async k=>{ try{ await tx('kv','readwrite',s=>s.delete(k)) }catch{} };
const allEntries=async()=>{ try{ return (await tx('entries','readonly',s=>s.getAll()))||[] }catch{ return [] } };
const putEntry=async e=>{ try{ await tx('entries','readwrite',s=>s.put(e)) }catch(err){ console.error('save failed',err); alert('存不進去，可能是空間不足。') } };
const delEntry=async id=>{ try{ await tx('entries','readwrite',s=>s.delete(id)) }catch{} };
const putPhoto=async(id,b)=>{ try{ await tx('photos','readwrite',s=>s.put(b,id)) }catch(err){ console.error('photo save failed',err) } };
const getPhoto=async id=>{ try{ return await tx('photos','readonly',s=>s.get(id)) }catch{ return undefined } };
const delPhoto=async id=>{ try{ await tx('photos','readwrite',s=>s.delete(id)) }catch{} };
const clearPhotos=async()=>{ try{ await tx('photos','readwrite',s=>s.clear()) }catch{} };
const clearEntries=async()=>{ try{ await tx('entries','readwrite',s=>s.clear()) }catch{} };

async function load(){
  S.settings=await kvGet('settings')||null;
  S.entries=(await allEntries()).sort((a,b)=>a.ts-b.ts);
  S.agentLog=await kvGet('agentLog')||[];
  S.agentMeta=await kvGet('agentMeta')||{};
  S.peer=await kvGet('peer')||null;
  await ensureMoment();
}

/* ---------- 今天的時刻 ---------- */
async function ensureMoment(){
  const k='moment:'+dkey(new Date());
  let m=await kvGet(k);
  if(!m){
    const now=new Date(), start=new Date(now), end=new Date(now);
    start.setHours(9,0,0,0); end.setHours(22,0,0,0);
    let at=null;
    if(now<end){ const lo=Math.max(now.getTime()+90e3,start.getTime()); at=Math.round(lo+Math.random()*(end.getTime()-lo)); }
    m={at,notified:false}; await kvSet(k,m);
  }
  S.moment=m;
}
const momentDone=()=>{const t=dkey(new Date());return S.entries.some(e=>e.moment&&e.date===t)};

/* 開著或剛切到背景時，時刻到了就送通知 */
async function tickMoment(){
  const m=S.moment; if(!m||!m.at||m.notified) return;
  if(Date.now()<m.at) return;
  m.notified=true; await kvSet('moment:'+dkey(new Date()),m);
  if(momentDone()) return;
  if(window.Notification&&Notification.permission==='granted'){
    try{ const reg=await navigator.serviceWorker.ready; reg.active&&reg.active.postMessage({type:'moment',day:dkey(new Date())}); }catch(e){ console.error(e) }
  }
}

/* ---------- 畫面 ---------- */
let dotView=null, lastBanner='';

function mountOnb(){
  obClear(); const ob=obState(), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T=(f,ms)=>obTimers.push(setTimeout(f,ms));
  if(ob.step===3){
    const pile=$('#obPile'); if(!pile) return;
    const W=pile.clientWidth||390, H=pile.clientHeight||360, N=reduce?14:26;
    const done=()=>{ const t=$('#obToast'); if(t) t.classList.add('on'); ob.ready=true; T(()=>obGo(4),reduce?2600:2000) };
    if(ob.ready){ for(let i=0;i<N;i++) pile.appendChild(obPh(i,W,H,false)); done(); return }
    for(let i=0;i<N;i++){
      const el=obPh(i,W,H,!reduce); pile.appendChild(el);
      if(!reduce) T(()=>{ el.style.transition='transform .55s cubic-bezier(.2,.8,.25,1.05),opacity .25s'; el.style.opacity='1'; el.style.transform=el.dataset.to },90+i*70);
    }
    T(done,reduce?200:90+N*70+500);
  }else if(ob.step===4){
    let left=119; const tick=()=>{ const e=$('#obCd'); if(!e) return; left=left<=0?119:left-1; e.textContent=`${Math.floor(left/60)}:${pad(left%60)}` };
    obTimers.push(setInterval(tick,1000));
    T(()=>obGo(5),2500);
  }else if(ob.step===5){
    const scr=$('#obDemo'), cap=$('#obCap'); if(!scr) return;
    const scenes=[
      ['cam','時刻一到，打開就拍',s=>{ T(()=>{ const c=$('#mkCam'); if(c) c.classList.add('flash') },1100) }],
      ['form','選一個主題，想寫一句也可以',s=>{ T(()=>{ const c=scr.querySelector('[data-t="2"]'); if(c) c.classList.add('on') },600);
        const txt='傍晚一起回家', ln=()=>$('#mkLn'); txt.split('').forEach((ch,i)=>T(()=>{ const l=ln(); if(l) l.textContent+=ch },1100+i*120)) }],
      ['strip','一週，變成一條拍貼',s=>{ scr.querySelectorAll('.strip i').forEach((f,i)=>T(()=>f.classList.add('f'),300+i*450)) }],
      ['obs','顯影偶爾說一句，它看見的',s=>{ const txt='這兩週你拍的地方，多半在傍晚，而且都有同一個人。'; txt.split('').forEach((ch,i)=>T(()=>{ const p=$('#mkObs'); if(p) p.textContent+=ch },300+i*70)) }],
    ];
    /* 四個畫面各播一次，播完自己到習慣頁；點一下跳下一個畫面 */
    const show=()=>{ if(!$('#obDemo')) return; obClear();
      if(ob.scene>=scenes.length){ ob.scene=0; obGo(OB_STEPS); return }
      const [kind,c,run]=scenes[ob.scene]; scr.innerHTML=obMock(kind); if(cap) cap.textContent=c; run(); ob.scene++; T(show,3000) };
    ob.next=show; ob.scene=0; show();
  }
}
function obPh(i,W,H,anim){
  const p=OB_PAL[i%OB_PAL.length], el=document.createElement('div'); el.className='ph';
  const x=Math.round((i*97)%Math.max(1,W-90)-14+((i*13)%23)), y=Math.round(((i*61)%Math.max(1,H-120))-10), r=((i*37)%44)-22;
  el.style.left=x+'px'; el.style.top=y+'px'; el.style.zIndex=i;
  el.innerHTML=`<i style="background:linear-gradient(${150+(i*23)%60}deg,${p[0]},${p[1]})"></i>`;
  const to=`rotate(${r}deg)`; el.dataset.to=to;
  if(anim){ el.style.opacity='0'; el.style.transform=`translateY(-${H+80}px) rotate(${r*2}deg)` } else el.style.transform=to;
  return el;
}

/* ---------- 習慣節奏 ----------
   S.settings.goal：每週幾次（0 = 隨手記）。一週從星期一算。打卡就是一則主題為「習慣」的紀錄（可以沒有照片和字）。 */
const goalN=()=>Math.max(0,Math.min(7,Number(S.settings&&S.settings.goal)||0));
const habitEs=()=>S.entries.filter(e=>e.theme==='habit');

function habitRecap(){
  const es=habitEs(); if(!es.length) return null;
  const first=parseD(es[0].date).getTime(); if(Date.now()-first<21*864e5) return null;   // 用了三週以上才回顧
  const weeks=[0,-1,-2,-3].map(o=>habitWeek(o)), g=goalN();

function habitSec(){
  const name=themeName('habit'), g=goalN(), wk=habitWeek(0), n=wk.length;

      ${just.line?`<p class="hsaid">${esc(just.line)}</p>`:`<div class="row2 hline"><input type="text" id="hLine" maxlength="40" placeholder="想寫感想再寫"><button class="btn" data-act="hline">存</button></div>`}

  }

    body=`<h2>今天想收到什麼？</h2><p class="sub">會是另一個人寫的一句話，明天送到。</p>
      <div class="ob-opts"><button class="ob-opt" data-act="pneed" data-v="understand">想被理解</button><button class="ob-opt" data-act="pneed" data-v="encourage">想被鼓勵</button><button class="ob-opt" data-act="pneed" data-v="">今天不用</button></div>`;
  }else if(q.step==='ctx'){
    body=`<h2>關於什麼？</h2><p class="sub">${q.need?'只用來找處境相近的人。':'留給別人的那句話，會送給選了同一個的人。'}</p>

    body=`<h2>也留一句給別人？</h2><p class="sub">如果有人也在為「${esc(q.ctx)}」煩，你想對他說什麼？</p>
      <textarea class="pnote" id="pText" maxlength="120" rows="4" placeholder="可以不寫">${esc(q.text)}</textarea>
      <p class="pwarn">只有這句話會匿名送出。你的紀錄和照片不會。</p>

      <div style="text-align:center;margin-top:14px"><button class="link" data-act="pskipnote">不留了</button></div>`;
  }else{
    body=`<h2>${esc(q.done.title)}</h2>${q.done.lines.map(l=>`<p class="sub">${esc(l)}</p>`).join('')}
      ${q.done.care?`<p class="pcare">如果你現在很不好受，可以打 1925 安心專線（24 小時），或 1995 生命線。</p>`:''}

  }
  $('#ovPeer').innerHTML=`<div class="in"><div style="display:flex;justify-content:flex-end;min-height:24px">${q.step==='done'?'':'<button class="link" data-act="pclose">直接離開</button>'}</div><div class="pq">${body}</div></div>`;

async function peerSubmit(){
  const q=S.pq; if(!q||q.busy) return;
  q.text=(($('#pText')||{}).value||q.text||'').trim();
  if(!q.need&&q.text.length<2){ closePeer(); return }
  q.busy=true; q.msg=''; renderPeer();
  try{
    if(!SB.client) throw new Error('offline');
    if(!SB.user) await sbEnsure(true);
    const {data:ss}=await SB.client.auth.getSession(); if(!ss||!ss.session) throw new Error('offline');
    const r=await fnCall('notes',{action:'submit',need:q.need||null,ctx:q.ctx,text:q.text});
    if(!r.ok) throw new Error(r.out.error||r.status);
    const lines=[];
    if(q.need) lines.push(r.out.request==='already'?'今天已經請求過了，明天會送來。':'明天會送來一句話。');
    if(q.text.length>=2) lines.push(r.out.note==='ok'?'你的話會送給需要的人。':r.out.note==='already'?'今天已經留過一句了。':'這句話要先給團隊看過，才會送出。');
    q.step='done'; q.done={title:'收到了。',lines,care:!!r.out.care}; q.busy=false; renderPeer(); peerSync(true);
  }catch(err){ console.error('peer',err); q.busy=false; q.msg=navigator.onLine?'沒有成功，等一下再試。':'沒有連上網路，等一下再試。'; renderPeer() }
}
let peerLast=0;
async function peerSync(force){
  if(!SB.client||!SB.user||!navigator.onLine||!peerOn()) return;
  if(!force&&Date.now()-peerLast<5*60e3) return; peerLast=Date.now();
  try{
    const r=await fnCall('notes',{action:'inbox'}); if(!r.ok) return;
    S.peer={items:r.out.items||[],request:r.out.request||null,stats:r.out.stats||null,at:Date.now()}; await kvSet('peer',S.peer);
    if(S.view==='today'&&!S.cap&&!S.pq){ const el=$('#peerSec'); if(el) el.outerHTML=peerSec() }
  }catch(err){ console.error('peer inbox',err) }
}
const PRX={felt:'有被陪伴到',notfit:'不太適合',report:'檢舉'};

  }).join('');

function weekStart(off){ const d=new Date(); d.setHours(0,0,0,0); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd+off*7); return d }
const DAYC=['一','二','三','四','五','六','日'];
const todayIdx=()=>(new Date().getDay()+6)%7;
/* 最早要顯示到哪一週：開始使用那天或最早一則紀錄，最多往回兩年 */
const BACKFILL_DAYS=14;
function minWeekOff(){
  const cur=weekStart(0).getTime();
  /* 往回多給 2 週：新使用者第一天就能從相簿補上過去的照片 */
  let first=(S.settings&&S.settings.since?parseD(S.settings.since).getTime():Date.now())-BACKFILL_DAYS*864e5;
  if(S.entries.length) first=Math.min(first,S.entries[0].ts);
  const d=new Date(first); d.setHours(0,0,0,0); d.setDate(d.getDate()-(d.getDay()+6)%7);
  return Math.max(-104,Math.min(0,Math.round((d.getTime()-cur)/(7*864e5))));
}
function weekRange(off){ const s=weekStart(off), e=new Date(s); e.setDate(s.getDate()+6); return `${s.getMonth()+1}/${s.getDate()} – ${e.getMonth()+1}/${e.getDate()}` }
function weekHasImg(off){ const s=weekStart(off).getTime(), e=s+7*864e5; return S.entries.some(x=>x.img&&x.ts>=s&&x.ts<e) }
/* 一格：同一天同一主題有多張時，放那天的時刻那張，沒有就放最後一張 */
function frameHTML(k,t,full){

  const x=es.find(y=>y.moment)||es[es.length-1], n=es.length>1?`<i class="n">${es.length}</i>`:'';
  if(!x.img&&t.k==='habit') return `<button class="frame stamp" data-act="full" data-id="${x.id}" aria-label="${esc(t.n)}，打卡${x.line?'：'+esc(x.line):''}"><span class="st"><i aria-hidden="true"></i><b>${esc(t.n)}</b><small>${k.slice(5).replace('-','.')}</small></span>${n}</button>`;
  if(!x.img) return `<button class="frame txt" data-act="full" data-id="${x.id}" aria-label="${esc(t.n)}${x.line?'：'+esc(x.line):''}"><b>${esc(t.n)}</b>${x.line?`<em>${esc(x.line.slice(0,24))}</em>`:''}${n}</button>`;
  return `<button class="frame" data-act="full" data-id="${x.id}" aria-label="${esc(t.n)}${t.k==='habit'?'，打卡':''}${x.line?'：'+esc(x.line):''}，放大">${full?`<img src="${x.img}" alt="" decoding="async">`:''}${t.k==='habit'?'<span class="mst" aria-hidden="true"><i></i></span>':''}${n}</button>`;
}
function stripsHTML(off,full){
  const s=weekStart(off), today=dkey(new Date()), now=Date.now();
  return DAYC.map((c,i)=>{
    const d=new Date(s); d.setDate(s.getDate()+i); const k=dkey(d), fut=d.getTime()>now&&k!==today;
    const frames=THEMES().map(t=>fut?`<div class="frame empty"><span>${esc(t.n)}</span></div>`:frameHTML(k,t,full)).join('');
    return `<div class="strip ${k===today?'today':''} ${fut?'future':''}" data-i="${i}" aria-label="${d.getMonth()+1}月${d.getDate()}日 週${c}">
      ${frames}<div class="foot"><b>Revela</b><span class="d">${k===today?'今天':fut?'還沒到':`${d.getMonth()+1}.${pad(d.getDate())} ${c}`}</span></div></div>`;
  }).join('');
}
function viewWeek(){
  const min=minWeekOff();
  S.weekOff=Math.max(min,Math.min(0,S.weekOff));
  if(S.dayIdx==null) S.dayIdx=todayIdx();
  let rows='';
  for(let off=min;off<=0;off++){
    const full=Math.abs(off-S.weekOff)<=1;
    rows+=`<section class="wrow" data-off="${off}"><span class="wk">${off===0?'這週':weekRange(off)}</span><div class="wtrack" data-off="${off}" data-full="${full?1:0}">${stripsHTML(off,full)}</div></section>`;
  }
  return `<div class="weekhead"><div><div class="rng" id="wkRng">${weekRange(S.weekOff)}</div><div class="hint">左右換天・上下換週</div></div>
      <div class="acts"><button class="btn" data-act="play" id="wkPlay" ${weekHasImg(S.weekOff)?'':'disabled'}>播放</button><button class="btn fill" data-act="save">存下來</button></div></div>
    <div class="wdays" id="wdays">${DAYC.map((c,i)=>`<button data-act="wday" data-i="${i}" class="${i===S.dayIdx?'on':''} ${S.weekOff===0&&i===todayIdx()?'td':''}" aria-label="週${c}">${c}</button>`).join('')}</div>
    <div class="booth" id="booth" data-lenis-prevent tabindex="-1">${rows}</div>`;

/* 版面：拍貼機要剛好塞滿「標題下方到分頁列上方」，頁面本身不捲 */
let boothH=0, boothStep=206;
const smooth=()=>matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
function layoutBooth(){
  const b=$('#booth'); if(!b) return;
  const top=b.getBoundingClientRect().top+scrollY, tabs=$('#tabs').offsetHeight||70;
  const H=Math.max(380,Math.round(innerHeight-top-tabs));
  const W=b.clientWidth||innerWidth;
  // 一條：上 padding 10 + 四格 + 三個間距 6 + 底下 34；上下各留 30 給週標與呼吸
  let fh=Math.floor((H-60-10-18-34)/4), fw=Math.round(fh*1.22);
  const maxW=Math.min(230,W*0.58); if(fw>maxW){ fw=Math.round(maxW); fh=Math.round(fw/1.22) }
  const sw=fw+20, gap=Math.max(14,Math.round(W*0.045));
  boothH=H; boothStep=sw+gap;
  b.style.height=H+'px';
  b.style.setProperty('--fh',fh+'px'); b.style.setProperty('--fw',fw+'px');
  b.style.setProperty('--sw',sw+'px'); b.style.setProperty('--gap',gap+'px');
}
function placeBooth(){
  const b=$('#booth'); if(!b) return;
  const min=minWeekOff();
  b.scrollTop=(S.weekOff-min)*boothH;
  b.querySelectorAll('.wtrack').forEach(t=>{ t.scrollLeft=S.dayIdx*boothStep });
}
function hydrateWeeks(){
  const b=$('#booth'); if(!b) return;
  b.querySelectorAll('.wtrack').forEach(t=>{
    const off=Number(t.dataset.off), want=Math.abs(off-S.weekOff)<=1?'1':'0';
    if(t.dataset.full!==want){ const L=t.scrollLeft; t.innerHTML=stripsHTML(off,want==='1'); t.dataset.full=want; t.scrollLeft=L }
  });
}
function syncWeekHead(){
  if(S.view==='week') skySync();
  const r=$('#wkRng'); if(r) r.textContent=weekRange(S.weekOff);
  const p=$('#wkPlay'); if(p) p.disabled=!weekHasImg(S.weekOff);
  document.querySelectorAll('#wdays button').forEach((x,i)=>{ x.classList.toggle('on',i===S.dayIdx); x.classList.toggle('td',S.weekOff===0&&i===todayIdx()) });
}
function mountBooth(){
  const b=$('#booth'); if(!b) return;
  layoutBooth(); placeBooth();
  /* iPhone：在會吸附捲動的容器裡，點一下常常不會產生 click（尤其剛滑完）。
     直接用觸控判斷「點一下」：手指移動小於 10px、0.7 秒內放開，就當作點擊並打開滿版，
     同時取消後續的 click，避免重複觸發。 */
  let tp=null;
  b.addEventListener('touchstart',ev=>{
    const f=ev.target.closest&&ev.target.closest('.frame[data-act="full"],.frame[data-act="addpast"]'), t=ev.touches[0];
    tp=(f&&ev.touches.length===1)?{f,x:t.clientX,y:t.clientY,t:Date.now()}:null;
  },{passive:true});
  b.addEventListener('touchmove',ev=>{ if(!tp) return; const t=ev.touches[0]; if(Math.hypot(t.clientX-tp.x,t.clientY-tp.y)>10) tp=null },{passive:true});
  b.addEventListener('touchcancel',()=>{ tp=null },{passive:true});
  b.addEventListener('touchend',ev=>{
    const p=tp; tp=null; if(!p||Date.now()-p.t>700) return;
    if(ev.cancelable) ev.preventDefault();
    if(p.f.dataset.act==='addpast'){ const r=p.f.getBoundingClientRect(); openCap(p.f.dataset.theme,false,{x:Math.round(r.left+r.width/2),y:Math.round(r.top+r.height/2)},p.f.dataset.date) }
    else openFull(p.f.dataset.id,p.f);
  },{passive:false});
  let vt=null;
  // 上下：換週。停下來之後才換內容，滑的過程不重排
  b.addEventListener('scroll',ev=>{
    if(ev.target===b){
      const T=b.scrollTop, dy=T-(b._lastT??T); b._lastT=T; if(dy) fx.flow(0,dy);
      const off=minWeekOff()+Math.round(b.scrollTop/boothH);
      if(off!==S.weekOff){
        S.weekOff=off; syncWeekHead();
        const row=b.querySelector(`.wtrack[data-off="${off}"]`); if(row) row.scrollLeft=S.dayIdx*boothStep;
      }
      clearTimeout(vt); vt=setTimeout(hydrateWeeks,140);
    }else if(ev.target.classList&&ev.target.classList.contains('wtrack')&&Number(ev.target.dataset.off)===S.weekOff){
      // 左右：換天
      const L=ev.target.scrollLeft, dx=L-(ev.target._lastL??L); ev.target._lastL=L; if(fx.flow) fx.flow(dx);
      const i=Math.max(0,Math.min(6,Math.round(L/boothStep)));
      if(i!==S.dayIdx){ S.dayIdx=i; syncWeekHead() }
    }
  },{capture:true,passive:true});
}
function goDay(i){
  i=Math.max(0,Math.min(6,i)); const t=document.querySelector(`#booth .wtrack[data-off="${S.weekOff}"]`);
  if(t) t.scrollTo({left:i*boothStep,behavior:smooth()});
}
function goWeek(dir){
  const b=$('#booth'); if(!b) return; const min=minWeekOff();
  const off=Math.max(min,Math.min(0,S.weekOff+dir)); b.scrollTo({top:(off-min)*boothH,behavior:smooth()});

/* 和後端、提示詞一致：滿 8 則，且第一則到最後一則跨 7 天 */

function spanDays(){ if(!S.entries.length) return 0; const ds=S.entries.map(e=>e.date).sort(); return Math.round((parseD(ds[ds.length-1])-parseD(ds[0]))/864e5)+1 }
/* 還沒到門檻時，說清楚差多少（可以從「這週」補過去的照片，所以講「跨幾天」不講「再過幾天」） */

/* ---------- 內建相機 ----------

   不支援或沒有允許時，退回系統相機／相簿。 */

/* 從 JPEG 的 EXIF 讀拍攝時間（DateTimeOriginal，手機當地時間）；讀不到回 null */
async function exifTime(file){
  try{
    const v=new DataView(await file.slice(0,262144).arrayBuffer());
    if(v.getUint16(0)!==0xFFD8) return null;
    let o=2;
    while(o+4<v.byteLength){
      const mk=v.getUint16(o), len=v.getUint16(o+2);
      if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966){
        const t=o+10, le=v.getUint16(t)===0x4949, u16=x=>v.getUint16(t+x,le), u32=x=>v.getUint32(t+x,le);
        const str=(x,n)=>{ let r=''; for(let i=0;i<n-1;i++) r+=String.fromCharCode(v.getUint8(t+x+i)); return r };
        const scan=(ifd,want)=>{ const n=u16(ifd); for(let i=0;i<n;i++){ const ent=ifd+2+i*12; if(u16(ent)===want) return ent } return 0 };
        let dt=null; const ifd0=u32(4), ex=scan(ifd0,0x8769);
        if(ex){ const sub=u32(ex+8), d=scan(sub,0x9003)||scan(sub,0x9004); if(d) dt=str(u32(d+8),u32(d+4)) }
        if(!dt){ const d=scan(ifd0,0x0132); if(d) dt=str(u32(d+8),u32(d+4)) }
        const m=dt&&dt.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
        return m?new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime():null;
      }
      if((mk&0xFF00)!==0xFF00) break;
      o+=2+len;
    }
  }catch(err){ console.error('exif',err) }
  return null;
}
/* 一張照片存兩份：
   full：長邊 2560px、JPEG .86 的原圖（Blob），給滿版、播放、備份用
   img ：長邊 720px 的縮圖（dataURL），給拍貼格子、列表、觀察者用（觀察者只看縮圖，不送原圖） */
const FULL_PX=2560, FULL_Q=.86, THUMB_PX=720, THUMB_Q=.82;
function drawScaled(src,M){
  const s=Math.min(1,M/Math.max(src.width,src.height)), w=Math.round(src.width*s), h=Math.round(src.height*s);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const g=cv.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(src,0,0,w,h); return cv;
}
async function processPhoto(file){
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    const full=await new Promise(r=>drawScaled(bmp,FULL_PX).toBlob(r,'image/jpeg',FULL_Q));
    const img=drawScaled(bmp,THUMB_PX).toDataURL('image/jpeg',THUMB_Q);
    bmp.close&&bmp.close();
    return {img,full};
  }catch(err){ console.error(err); return null }
}
async function thumbFromBlob(b){
  try{ const bmp=await createImageBitmap(b); const u=drawScaled(bmp,THUMB_PX).toDataURL('image/jpeg',THUMB_Q); bmp.close&&bmp.close(); return u }catch{ return null }
}
/* 原圖網址（有原圖就用原圖，沒有就退回縮圖）；只留最近 16 張的 object URL */
const fullURLs=new Map();
async function photoURL(e){
  if(!e||!e.img) return e&&e.img;
  if(fullURLs.has(e.id)) return fullURLs.get(e.id);
  const b=await getPhoto(e.id); if(!b) return e.img;
  const u=URL.createObjectURL(b); fullURLs.set(e.id,u);
  if(fullURLs.size>16){ const [k,v]=fullURLs.entries().next().value; URL.revokeObjectURL(v); fullURLs.delete(k) }
  return u;
}
function forgetURL(id){ const u=fullURLs.get(id); if(u){ URL.revokeObjectURL(u); fullURLs.delete(id) } }

function spaced(g,txt,x,y,sp,align){
  const chars=[...txt], ws=chars.map(c=>g.measureText(c).width), tot=ws.reduce((a,b)=>a+b,0)+sp*(chars.length-1);
  let cx=align==='center'?x-tot/2:align==='right'?x-tot:x; const a0=g.textAlign; g.textAlign='left';
  chars.forEach((c,i)=>{ g.fillText(c,cx,y); cx+=ws[i]+sp }); g.textAlign=a0; return tot;
}
function wrapText(g,txt,x,y,maxW,lh,maxLines){
  let line='', lines=[];
  for(const c of [...txt]){ if(g.measureText(line+c).width>maxW&&line){ lines.push(line); line=c } else line+=c }
  if(line) lines.push(line);
  if(lines.length>maxLines){ lines=lines.slice(0,maxLines); lines[maxLines-1]=lines[maxLines-1].slice(0,-1)+'…' }
  lines.forEach((l,i)=>g.fillText(l,x,y+i*lh)); return lines.length;
}
function paperBg(g,W,H){
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,EXC.sky); gr.addColorStop(.38,EXC.haze); gr.addColorStop(1,EXC.horizon);
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  // 車窗外流過的樹影：很淡、很糊的一條帶
  g.save(); g.filter='blur(28px)'; g.globalAlpha=.16; g.fillStyle='#8C786B';
  for(let x=-60;x<W+60;x+=70){ const h=60+((x*37)%90); g.beginPath(); g.ellipse(x,H*.58-h*.35,48,h,0,0,Math.PI*2); g.fill() }
  g.restore();
  // 水平的動態模糊紋
  g.save(); g.globalAlpha=.035; g.filter='blur(1.5px)';
  for(let y=0;y<H;y+=6){ const v=(Math.sin(y*.071)+Math.sin(y*.023+1.7))*.5; g.fillStyle=v>0?'#FFF7EE':'#6E5847'; g.fillRect(0,y,W,3) }
  g.restore();
}
async function frameDraw(g,e,tname,x,y,w,h,fs){
  if(!e){ g.fillStyle=EXC.paper2; g.fillRect(x,y,w,h); g.fillStyle=EXC.ink3; g.font=`${Math.round(fs*.8)}px ${EXSANS}`; g.textBaseline='alphabetic'; g.fillText(tname,x+fs*.6,y+h-fs*.55); return }
  const im=e.img?await loadImg(e.img):null;
  if(im) coverDraw(g,im,x,y,w,h);
  else{ g.fillStyle=EXC.dark; g.fillRect(x,y,w,h); g.fillStyle=EXC.paper; g.font=`${fs}px ${EXSERIF}`; g.textBaseline='alphabetic';
    const lh=fs*1.5, n=Math.max(1,Math.floor((h-fs)/lh)); wrapText(g,e.line||tname,x+fs*.7,y+h-fs*.7-(Math.min(n,Math.ceil(g.measureText(e.line||tname).width/(w-fs*1.4)))-1)*lh,w-fs*1.4,lh,n) }
}
/* 一條拍貼：o={fw,fh,pad,gap,foot,fs,label,today,future} */
async function stripDraw(g,k,x,y,o){
  const W=o.fw+o.pad*2, H=o.pad+o.fh*4+o.gap*3+o.foot;
  g.save(); if(o.future) g.globalAlpha=.42;
  g.save(); g.shadowColor='rgba(0,0,0,.22)'; g.shadowBlur=o.pad*1.6; g.shadowOffsetY=o.pad*.5; g.fillStyle=EXC.paper; g.fillRect(x,y,W,H); g.restore();
  const th=THEMES();
  for(let i=0;i<4;i++) await frameDraw(g,o.future?null:pickEntry(k,th[i].k),th[i].n,x+o.pad,y+o.pad+i*(o.fh+o.gap),o.fw,o.fh,o.fs);
  const fy=y+o.pad+o.fh*4+o.gap*3+o.foot*.6;
  g.textBaseline='middle'; g.fillStyle=EXC.ink; g.font=`600 ${Math.round(o.foot*.34)}px ${EXSERIF}`;
  g.font=`600 ${Math.round(o.foot*.36)}px ${EXWORD}`; g.fillText('Revela',x+o.pad,fy);
  g.fillStyle=o.today?EXC.safe:EXC.ink2; g.font=`${o.today?'600 ':''}${Math.round(o.foot*.32)}px ${EXSERIF}`; g.textAlign='right'; g.fillText(o.label,x+W-o.pad,fy); g.textAlign='left';
  g.restore(); return {W,H};
}
function header(g,small,big,sub){

  g.fillStyle=EXC.ink; g.font=`600 96px ${EXSERIF}`; g.fillText(big,84,285);

function brand(g,W,y){ g.fillStyle=EXC.ink; g.font=`600 46px ${EXWORD}`; g.textBaseline='middle'; g.textAlign='center'; g.fillText('Revela',W/2,y); g.textAlign='left' }
async function renderExport(kind){
  const W=1080,H=1920, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d');
  try{ await document.fonts.load('600 40px "Fraunces"'); await document.fonts.ready }catch{}
  paperBg(g,W,H);
  const ws=weekStart(S.weekOff), today=dkey(new Date()), now=Date.now();
  const sel=new Date(ws); sel.setDate(ws.getDate()+(S.dayIdx||0));
  if(kind==='day'){
    const k=dkey(sel);
    header(g,'你 的 一 天',`${sel.getMonth()+1}月${sel.getDate()}日`,`${sel.getFullYear()} · 週${WD[sel.getDay()]}`);
    const fh=Math.floor((1740-420-28-54-96)/4), fw=Math.round(fh*1.3), o={fw,fh,pad:28,gap:18,foot:96,fs:30,label:k===today?'今天':`${sel.getMonth()+1}.${pad(sel.getDate())} ${WD[sel.getDay()]}`,today:k===today};
    const sw=fw+56, sh=28+fh*4+54+96, x=(W-sw)/2, y=420;
    g.save(); g.translate(x+sw/2,y+sh/2); g.rotate(-0.018); await stripDraw(g,k,-sw/2,-sh/2,o); g.restore();
  }else if(kind==='week'){
    const e=new Date(ws); e.setDate(ws.getDate()+6);
    header(g,'你 的 這 一 週',`${ws.getMonth()+1}/${ws.getDate()} – ${e.getMonth()+1}/${e.getDate()}`,`${ws.getFullYear()}`);
    const cols=4, gx=28, sw=(W-120-gx*(cols-1))/cols, pd=14, fw=Math.round(sw-pd*2), foot=58, top=430, gy=34;
    const sh=Math.floor((H-top-180-gy)/2), fh=Math.floor((sh-pd-8*3-foot)/4);
    for(let i=0;i<8;i++){
      const x=60+(i%cols)*(sw+gx), y=top+Math.floor(i/cols)*(sh+gy);
      if(i===7){ // 第八格：標籤卡
        g.save(); g.shadowColor='rgba(0,0,0,.18)'; g.shadowBlur=20; g.shadowOffsetY=6; g.fillStyle=EXC.dark; g.fillRect(x,y,sw,sh); g.restore();
        g.fillStyle=EXC.paper; g.font=`600 52px ${EXWORD}`; g.textBaseline='middle'; g.textAlign='center'; g.fillText('Revela',x+sw/2,y+sh/2-30); g.textAlign='left';
        g.font=`26px ${EXSERIF}`; g.globalAlpha=.75; g.textAlign='center'; g.fillText(`${ws.getMonth()+1}/${ws.getDate()} – ${e.getMonth()+1}/${e.getDate()}`,x+sw/2,y+sh/2+36); g.textAlign='left'; g.globalAlpha=1;
        continue;
      }
      const d=new Date(ws); d.setDate(ws.getDate()+i); const k=dkey(d);
      await stripDraw(g,k,x,y,{fw,fh,pad:pd,gap:8,foot,fs:17,label:k===today?'今天':`${WD[d.getDay()]} ${d.getMonth()+1}.${pad(d.getDate())}`,today:k===today,future:d.getTime()>now&&k!==today});
    }
  }else{
    const m0=new Date(sel.getFullYear(),sel.getMonth(),1), dim=new Date(sel.getFullYear(),sel.getMonth()+1,0).getDate();
    const lead=(m0.getDay()+6)%7, rows=Math.ceil((lead+dim)/7);
    header(g,'你 的 這 個 月',`${m0.getMonth()+1}月`,`${m0.getFullYear()}`);
    const gx=14, cw=(W-120-gx*6)/7, top=470, ch=Math.min(250,(H-top-170-gx*(rows-1))/rows);
    g.fillStyle=EXC.ink2; g.font=`28px ${EXSERIF}`; g.textBaseline='alphabetic'; g.textAlign='center';
    ['一','二','三','四','五','六','日'].forEach((c,i)=>g.fillText(c,60+i*(cw+gx)+cw/2,top-22)); g.textAlign='left';
    for(let n=1;n<=dim;n++){
      const d=new Date(m0.getFullYear(),m0.getMonth(),n), k=dkey(d), i=lead+n-1, x=60+(i%7)*(cw+gx), y=top+Math.floor(i/7)*(ch+gx);
      const fut=d.getTime()>now&&k!==today, es=S.entries.filter(z=>z.date===k), pick=es.find(z=>z.moment&&z.img)||es.find(z=>z.img);
      g.save(); if(fut) g.globalAlpha=.4;
      g.save(); g.shadowColor='rgba(0,0,0,.16)'; g.shadowBlur=10; g.shadowOffsetY=3; g.fillStyle=EXC.paper; g.fillRect(x,y,cw,ch); g.restore();
      const ix=x+6, iy=y+6, iw=cw-12, ih=ch-46;
      const im=pick?await loadImg(pick.img):null;
      if(im) coverDraw(g,im,ix,iy,iw,ih); else{ g.fillStyle=es.length?EXC.dark:EXC.paper2; g.fillRect(ix,iy,iw,ih) }
      g.fillStyle=k===today?EXC.safe:EXC.ink; g.font=`${k===today?'600 ':''}24px ${EXSERIF}`; g.textBaseline='middle'; g.fillText(String(n),x+9,y+ch-20);
      if(es.length>1){ g.fillStyle=EXC.ink3; g.font=`18px ${EXSANS}`; g.textAlign='right'; g.fillText('·'.repeat(Math.min(4,es.length)),x+cw-9,y+ch-20); g.textAlign='left' }
      g.restore();
    }
  }

async function buildExport(){

async function saveExport(){
  if(!expBlob) return;
  const ws=weekStart(S.weekOff), sel=new Date(ws); sel.setDate(ws.getDate()+(S.dayIdx||0));
  const tag=S.exp==='day'?dkey(sel):S.exp==='week'?dkey(ws):dkey(sel).slice(0,7);
  const file=new File([expBlob],`Revela-${EXPN[S.exp]}-${tag}.jpg`,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return }catch(e){ if(e&&e.name==='AbortError') return }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ---------- 同意與種子測試 ----------
   同意紀錄：S.settings.consent = {v, backup, ai, research, ts, syncedUid}（本機先存，登入後寫入 consents 表）
   分組：S.settings.part = {ai_from, uid}（伺服器 participants 表的快取）；S.settings.pendingCode = 還沒兌換的邀請碼 */
const CONSENT_V='v1';
const consent=()=>(S.settings&&S.settings.consent)||null;
const aiOn=()=>{ const c=consent(); return !!(c&&c.ai) };
const researchOn=()=>{ const c=consent(); return !!(c&&c.research) };
const part=()=>(S.settings&&S.settings.part)||null;
const aiFromStr=d=>{ const x=parseD(d); return `${x.getMonth()+1} 月 ${x.getDate()} 日` };
const partActive=()=>{ const p=part(); return !!(p&&p.ai_from&&p.ai_from<=dkey(new Date())) };
async function saveSettings(patch){ S.settings=Object.assign({},S.settings,patch); await kvSet('settings',S.settings) }
async function consentSet(patch){
  const c=Object.assign({v:CONSENT_V,backup:true,ai:true,research:false},consent()||{},patch,{v:CONSENT_V,ts:Date.now(),syncedUid:null});
  await saveSettings({consent:c,backup:c.backup});
  syncStudy();
}
/* 帳號在的時候：補寫同意紀錄、兌換邀請碼、讀分組 */
let studyBusy=false;
async function syncStudy(){
  if(!SB.client||!SB.user||studyBusy||!S.settings) return;
  studyBusy=true; const uid=SB.user.id, before=JSON.stringify(part());
  try{
    const c=consent();
    if(c&&c.syncedUid!==uid){
      const {error}=await SB.client.from('consents').insert({user_id:uid,version:c.v,backup:!!c.backup,ai:!!c.ai,research:!!c.research});
      if(!error) await saveSettings({consent:Object.assign({},c,{syncedUid:uid})}); else console.error('consent',error);
    }
    const ik=S.settings.intake;
    if(ik&&researchOn()&&ik.syncedUid!==uid){
      const {error}=await SB.client.from('intake').insert({user_id:uid,version:'v'+ik.v,q1:ik.q1,q2:ik.q2,q3:ik.q3,skipped_at:ik.skippedAt,answered_at:new Date(ik.ts).toISOString()});
      if(!error||error.code==='23505') await saveSettings({intake:Object.assign({},ik,{syncedUid:uid})}); else console.error('intake',error);
    }
    if(S.settings.pendingCode){ await redeemCode(S.settings.pendingCode,true) }
    const {data,error}=await SB.client.from('participants').select('ai_from').eq('user_id',uid).maybeSingle();
    if(!error){
      const np=data?{ai_from:data.ai_from||null,uid}:null, op=part();
      if(JSON.stringify(np)!==JSON.stringify(op)) await saveSettings({part:np});
    }
    if(JSON.stringify(part())!==before&&!S.cap&&S.view!=='settings') render();
    await syncFeedback();
  }catch(err){ console.error('study',err) }
  studyBusy=false;
  refreshStudy();
  peerSync();
}
async function fnCall(name,body){
  const {data:ss}=await SB.client.auth.getSession(); const tok=ss&&ss.session&&ss.session.access_token; if(!tok) throw new Error('auth');
  const res=await fetch(window.SUPABASE_CONFIG.url.replace(/\/$/,'')+'/functions/v1/'+name,{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok,'apikey':window.SUPABASE_CONFIG.anonKey},body:JSON.stringify(body)});
  const out=await res.json().catch(()=>({}));
  return {status:res.status,ok:res.ok&&!out.error,out};
}
/* 兌換邀請碼；還沒有帳號時先記著，登入後自動兌換 */
async function redeemCode(code,quiet){
  code=String(code||'').trim().toUpperCase(); if(!code) return;
  if(!SB.client||!SB.user||!navigator.onLine){ await saveSettings({pendingCode:code}); S.studyMsg='邀請碼記下了，連上網路後會自動啟用。'; if(!SB.user) sbEnsure(); refreshStudy(); return }
  try{
    const r=await fnCall('account',{action:'redeem',code});
    if(r.ok){ await saveSettings({pendingCode:null,part:{ai_from:r.out.ai_from||null,uid:SB.user.id}}); S.studyMsg=r.out.already?'這個帳號已經加入過了。':'加入了，謝謝你。'; if(!quiet&&!S.cap) render() }
    else if(r.out.error==='bad_code'){ await saveSettings({pendingCode:null}); S.studyMsg='這個邀請碼不對，或已經用完了。' }
    else S.studyMsg='沒有成功，等一下再試。';
  }catch(err){ console.error(err); S.studyMsg='沒有成功，等一下再試。' }
  refreshStudy();
}
async function syncFeedback(){
  if(!SB.client||!SB.user||!researchOn()) return;
  let dirty=false;
  for(const m of S.agentLog){
    if(!m.obsId||!m.fbDirty) continue;
    const {error}=await SB.client.from('observations').update({reaction:m.reaction||null,reply:m.reply||'',reacted_at:new Date().toISOString()}).eq('id',m.obsId);
    if(!error){ m.fbDirty=false; dirty=true }
  }
  if(dirty) await kvSet('agentLog',S.agentLog);
}

/* ---------- 雲端備份（Supabase） ----------
   預設不用登入：第一次開啟就用「匿名登入」自動備份（照片 → Storage photos/<uid>/<id>.jpg、資料 → entries）。
   匿名帳號清掉瀏覽器資料或換手機就找不回來，所以設定裡可以「綁定 email」（選填）：
     · email 沒人用過 → 把這個匿名帳號升級成 email 帳號（updateUser + 驗證碼 type=email_change）
     · email 已經有帳號 → 改成登入那個帳號（signInWithOtp + type=email），本機資料會補傳進去、雲端資料會還原回來
   使用者可以隨時暫停備份（設定裡）；暫停後不會再自動建立匿名帳號。 */
const SB={client:null,user:null,busy:false,err:'',last:0,again:false,anonBusy:false,anonErr:''};
S.bk={step:'email',email:'',msg:'',mode:'link'};
const bkOn=()=>!(S.settings&&S.settings.backup===false);
const isAnon=()=>!!(SB.user&&SB.user.is_anonymous);
function sbInit(){
  const c=window.SUPABASE_CONFIG;
  if(!c||!window.supabase||!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(c.url||'')||!c.anonKey||/PASTE|YOUR/.test(c.anonKey)) return;
  try{
    SB.client=window.supabase.createClient(c.url.replace(/\/$/,''),c.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'revela-auth'}});
  }catch(err){ console.error('supabase',err); SB.client=null; return }
  SB.client.auth.onAuthStateChange((ev,session)=>{
    const u=session?session.user:null, changed=(u&&u.id)!==(SB.user&&SB.user.id);
    SB.user=u; refreshBk();
    if(changed){ if(S.settings&&!S.cap) render(); if(u) setTimeout(async()=>{ syncAll(); await syncStudy() },0) }
  });
  SB.client.auth.getSession().then(()=>sbEnsure());
}
/* 沒有登入、備份又是開著的，就在背景建立匿名帳號（要先有網路，沒網路等 online 事件） */
async function sbEnsure(force){
  const need=!!force||bkOn()||aiOn()||researchOn()||!!(S.settings&&S.settings.pendingCode);
  if(!SB.client||SB.user||SB.anonBusy||!S.settings||!consent()||!need||!navigator.onLine) return;
  SB.anonBusy=true; SB.anonErr='';
  try{
    const {data,error}=await SB.client.auth.getSession();
    if(!error&&data&&data.session){ SB.user=data.session.user; syncStudy(); return }
    const r=await SB.client.auth.signInAnonymously();
    if(r.error) throw r.error;
  }catch(err){ console.error('anon',err); SB.anonErr=String(err&&err.message||err) }
  finally{ SB.anonBusy=false; refreshBk() }
}
async function setBackup(on){
  S.settings=Object.assign({},S.settings,{backup:on}); await kvSet('settings',S.settings);
  if(consent()&&consent().backup!==on) await consentSet({backup:on});
  if(on){ await sbEnsure(); syncSoon(300) }
  refreshBk(); const n=$('#dataNote'); if(n) n.textContent=dataNote();
}
/* 想綁 email：先試著把目前的匿名帳號升級；email 已經有人用就改成登入那個帳號 */
async function sbSend(){
  const em=(($('#bkEmail')||{}).value||'').trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ S.bk.msg='email 看起來不太對。'; refreshBk(); return }
  S.bk={step:'email',email:em,msg:'寄送中…',mode:'link'}; refreshBk();
  const rateMsg=e=>/rate|limit|seconds|too many/i.test(e.message||'')?'寄得太頻繁了，等一下再試。':'寄不出去：'+e.message;
  if(SB.user&&SB.user.is_anonymous){
    const {error}=await SB.client.auth.updateUser({email:em});
    if(!error){ S.bk={step:'code',email:em,msg:'',mode:'link'}; refreshBk(); setTimeout(()=>{ const i=$('#bkCode'); i&&i.focus() },60); return }
    if(!/already|registered|exists|taken|duplicate/i.test((error.code||'')+' '+(error.message||''))){ S.bk.msg=rateMsg(error); refreshBk(); return }
    // 這個 email 已經有帳號：登入它。先把這個匿名帳號在雲端的副本清掉（本機還在，登入後會補傳進新帳號）
    await sbWipeCloud(true);
  }
  const {error}=await SB.client.auth.signInWithOtp({email:em,options:{shouldCreateUser:true}});
  if(error){ S.bk.msg=rateMsg(error); refreshBk(); return }
  S.bk={step:'code',email:em,msg:'',mode:'signin'}; refreshBk(); setTimeout(()=>{ const i=$('#bkCode'); i&&i.focus() },60);
}
async function sbVerify(){
  const code=(($('#bkCode')||{}).value||'').replace(/\D/g,'');
  if(code.length<6){ S.bk.msg='輸入信裡的數字驗證碼。'; refreshBk(); return }
  const mode=S.bk.mode, em=S.bk.email;
  S.bk.msg='確認中…'; refreshBk();
  const {error}=await SB.client.auth.verifyOtp({email:em,token:code,type:mode==='link'?'email_change':'email'});
  if(error){ S.bk.msg=/expired|invalid/i.test(error.message)?'驗證碼不對或過期了，再寄一次。':'沒有成功：'+error.message; refreshBk(); return }
  S.bk={step:'email',email:'',msg:'',mode:'link'};
  if(mode==='link'){ try{ const {data}=await SB.client.auth.getUser(); if(data&&data.user) SB.user=data.user }catch{} }
  refreshBk(); render(); syncSoon(200);
}
function bkHTML(){
  if(!SB.client) return `<h3>備份</h3><p class="st">雲端備份還沒設定好（supabase-config.js）。</p>`;
  const sw=on=>`<button class="link" data-act="${on?'bkon':'bkoff'}">${on?'重新開啟備份':'暫停備份'}</button>`;
  if(!bkOn()) return `<h3>備份</h3><p class="st">已暫停，紀錄只存在這支手機。</p>${sw(true)}`;
  const emailForm=(title,hint)=>{
    const b=S.bk, msg=b.msg?`<p class="st ${/不對|沒有|寄不出|頻繁/.test(b.msg)?'err':''}">${esc(b.msg)}</p>`:'';
    if(b.step==='code') return `<p class="st">驗證碼寄到 ${esc(b.email)} 了，輸入信裡的數字。</p>
      <div class="row2"><input type="text" id="bkCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="驗證碼"><button class="btn fill" data-act="sbverify">確認</button></div>
      ${msg}<p style="margin-top:10px"><button class="link" data-act="sbback">換一個 email／重寄</button></p>`;
    return `<p class="st"><b>${title}</b>${hint?`<br>${hint}`:''}</p>
      <div class="row2"><input type="email" id="bkEmail" autocomplete="email" placeholder="你的 email" value="${esc(b.email)}"><button class="btn fill" data-act="sbsend">寄驗證碼</button></div>${msg}`;
  };
  if(!SB.user){
    if(SB.anonBusy) return `<h3>備份</h3><p class="st">正在準備備份…</p>`;
    if(SB.anonErr){
      const off=/anonymous|disabled|not enabled|signups/i.test(SB.anonErr);
      return `<h3>備份</h3><p class="st err">${off?'這個專案還沒開啟匿名登入，備份暫時用不了。':'備份還沒準備好：'+esc(SB.anonErr)}</p>
        ${S.bk.step==='code'?emailForm():emailForm('改用 email 登入','')}
        <p style="margin-top:8px"><button class="link" data-act="sbretry">重試</button></p>`;
    }
    return `<h3>備份</h3><p class="st">${navigator.onLine?'備份準備中…':'現在沒有網路，連上之後會自動開始備份。'}</p>${sw(false)}`;
  }
  const total=S.entries.length, done=S.entries.filter(e=>e.sync==='done').length;
  const st=SB.busy?'備份中…':SB.err?SB.err:(done===total?`已備份 ${total} 則`:`已備份 ${done}／${total} 則`)+(SB.last&&!SB.busy&&!SB.err?` · ${rel(SB.last)}同步`:'');
  const status=`<p class="st ${SB.err?'err':''}">${isAnon()?'':`${esc(SB.user.email||'')} · `}${esc(st)}</p>`;
  const links=`<div class="linkrow"><button class="link" data-act="sbsync" ${SB.busy?'disabled':''}>立即同步</button>${isAnon()?'':'<button class="link" data-act="sbout">登出</button>'}${sw(false)}</div>`;
  if(isAnon()) return `<h3>備份</h3>${status}
    <div style="margin:14px 0 4px">${emailForm('綁定 email（選填）','換手機時用來找回照片。')}</div>${links}`;
  return `<h3>備份</h3>${status}${links}`;
}
function dataNote(){ return '' }
function refreshBk(){ const g=$('#bkGrp'); if(g) g.innerHTML=bkHTML(); const n=$('#dataNote'); if(n) n.textContent=dataNote() }
let syncT=null;
function syncSoon(ms){ clearTimeout(syncT); syncT=setTimeout(()=>syncAll(),ms==null?600:ms) }
async function queueDel(id){ if(!SB.client||!bkOn()) return; const l=await kvGet('syncDel')||[]; if(!l.includes(id)){ l.push(id); await kvSet('syncDel',l) } syncSoon() }
async function syncAll(manual){
  if(!SB.client||!bkOn()) return;
  if(!SB.user){ sbEnsure(); return }
  if(SB.busy){ SB.again=true; return }
  if(!navigator.onLine){ if(manual){ SB.err='現在沒有網路，連上之後會自動補上。'; refreshBk() } return }
  SB.busy=true; SB.err=''; refreshBk();
  const uid=SB.user.id, store=SB.client.storage.from('photos');
  try{
    // 換了帳號：本機全部重新上傳到新帳號
    if((await kvGet('syncUid'))!==uid){ for(const e of S.entries){ if(e.sync){ delete e.sync; await putEntry(e) } } await kvSet('syncUid',uid) }
    // 1) 刪除
    const dels=await kvGet('syncDel')||[];
    for(const id of dels.slice()){
      await store.remove([`${uid}/${id}.jpg`]);
      const {error}=await SB.client.from('entries').delete().eq('user_id',uid).eq('id',id); if(error) throw error;
      dels.splice(dels.indexOf(id),1); await kvSet('syncDel',dels);
    }
    // 2) 上傳
    for(const e of S.entries.slice()){
      if(e.sync==='done') continue;
      let blob=null;
      if(e.img){ blob=await getPhoto(e.id); if(!blob){ blob=await (await fetch(e.img)).blob() } }   // 舊紀錄沒有原圖，就備份手上最好的那張
      if(blob){ const {error}=await store.upload(`${uid}/${e.id}.jpg`,blob,{upsert:true,contentType:'image/jpeg',cacheControl:'31536000'}); if(error) throw error }
      const {error}=await SB.client.from('entries').upsert({user_id:uid,id:e.id,ts:e.ts,date:e.date,theme:e.theme,line:e.line||'',late:!!e.late,moment:!!e.moment,backfill:!!e.backfill,has_photo:!!blob,updated_at:new Date().toISOString()});
      if(error) throw error;
      e.sync='done'; await putEntry(e); refreshBk();
    }
    // 3) 還原：雲端有、本機沒有
    const have=new Set(S.entries.map(e=>e.id)), skip=new Set(await kvGet('syncDel')||[]);
    let added=0;
    for(let from=0;;from+=1000){
      const {data,error}=await SB.client.from('entries').select('id,ts,date,theme,line,late,moment,backfill,has_photo').order('ts').range(from,from+999);
      if(error) throw error;
      for(const r of data||[]){
        if(have.has(r.id)||skip.has(r.id)) continue;
        const e={id:r.id,ts:Number(r.ts),date:r.date,theme:r.theme,line:r.line||'',late:!!r.late,moment:!!r.moment,backfill:!!r.backfill,img:null,sync:'done'};
        if(r.has_photo){ const {data:b,error:er}=await store.download(`${uid}/${r.id}.jpg`); if(!er&&b){ await putPhoto(r.id,b); e.img=await thumbFromBlob(b) } }
        S.entries.push(e); await putEntry(e); have.add(r.id); added++;
      }
      if(!data||data.length<1000) break;
    }
    if(added){ S.entries.sort((a,b)=>a.ts-b.ts); if(!S.cap) render() }
    SB.last=Date.now(); await kvSet('syncLast',SB.last);
  }catch(err){ console.error('sync',err); SB.err='這次備份沒有成功，等一下會自己再試。' }
  SB.busy=false; refreshBk();
  if(SB.again){ SB.again=false; syncSoon(300) }
}
/* 刪掉目前帳號在雲端的所有照片與紀錄，並把本機的「已備份」標記清掉（之後若再開備份會重新上傳） */
async function sbWipeCloud(quiet){
  const uid=SB.user.id, store=SB.client.storage.from('photos');
  for(;;){
    const {data,error}=await store.list(uid,{limit:1000}); if(error) throw error;
    if(!data||!data.length) break;
    const {error:e2}=await store.remove(data.map(o=>`${uid}/${o.name}`)); if(e2) throw e2;
    if(data.length<1000) break;
  }
  const {error}=await SB.client.from('entries').delete().eq('user_id',uid); if(error) throw error;
  for(const e of S.entries){ if(e.sync){ delete e.sync; await putEntry(e) } }
  await kvDel('syncDel'); await kvDel('syncUid');
}
async function sbWipe(){
  if(!SB.user) return;
  if(!confirm('刪除雲端上你所有的照片和紀錄，並暫停備份？\n這支手機上的紀錄不受影響。雲端的部分無法復原。')) return;
  SB.busy=true; refreshBk();
  try{
    await sbWipeCloud();
    S.settings=Object.assign({},S.settings,{backup:false}); await kvSet('settings',S.settings);
    try{ await SB.client.auth.signOut({scope:'local'}) }catch{}
    SB.busy=false; alert('雲端上的資料已經刪掉了，備份也暫停了。');
  }catch(err){ console.error(err); SB.busy=false; SB.err='刪除沒有完成，請再試一次。' }
  refreshBk(); render();
}

function openSettings(){ if(S.view!=='settings'){ S.view='settings'; render({enter:true,nav:true}); dotView='settings'; fx.nav('settings') } }
/* ---------- 月曆 ----------
   每天一格放那天的照片（優先放時刻那張），最新的月份在最上面。
   點有紀錄的日子 → 跳到「這週」的那一天；點沒拍的過去日子 → 補一張；今天沒拍 → 直接拍 */
function monthFirstDate(){
  let first=(S.settings&&S.settings.since?parseD(S.settings.since).getTime():Date.now())-BACKFILL_DAYS*864e5;
  if(S.entries.length) first=Math.min(first,S.entries[0].ts);
  const d=new Date(first); d.setHours(0,0,0,0); return d;
}
function dayCover(es){ const ph=es.filter(e=>e.img); return ph.find(e=>e.moment)||ph[ph.length-1]||null }
function viewMonth(){
  const byDate={}; for(const e of S.entries) (byDate[e.date]=byDate[e.date]||[]).push(e);
  const first=monthFirstDate(), firstKey=dkey(first), now=new Date(), today=dkey(now), months=[];
  let y=now.getFullYear(), m=now.getMonth();
  while(y>first.getFullYear()||(y===first.getFullYear()&&m>=first.getMonth())){ months.push([y,m]); if(--m<0){ m=11; y-- } }
  return months.map(([y,m])=>{
    const lead=(new Date(y,m,1).getDay()+6)%7, n=new Date(y,m+1,0).getDate();
    let cells='<i></i>'.repeat(lead);
    for(let i=1;i<=n;i++){
      const k=dkey(new Date(y,m,i)), es=byDate[k]||[], c=dayCover(es), off=k>today||k<firstKey, nPh=es.filter(e=>e.img).length;
      const cls=['mday',c&&'has',es.length&&!c&&'dot',k===today&&'td',off&&'off'].filter(Boolean).join(' ');
      cells+=`<button class="${cls}" data-act="mday" data-date="${k}" ${off?'disabled':''} aria-label="${m+1}月${i}日${es.length?`，${es.length} 則`:''}">${c?`<img src="${c.img}" alt="" loading="lazy">`:''}<span class="dn">${i}</span>${nPh>1?`<span class="mn">${nPh}</span>`:''}</button>`;
    }
    return `<section class="month"><h2 class="mhead">${y} 年 ${m+1} 月</h2>
      <div class="mgrid mwk">${DAYC.map(c=>`<span>${c}</span>`).join('')}</div><div class="mgrid">${cells}</div></section>`;
  }).join('');
}
function openDay(dateKey){
  const D=parseD(dateKey), mon=new Date(D); mon.setDate(D.getDate()-(D.getDay()+6)%7);
  S.weekOff=Math.round((mon.getTime()-weekStart(0).getTime())/(7*864e5)); S.dayIdx=(D.getDay()+6)%7;
  S.view='week'; render({enter:true,nav:true}); dotView='week'; fx.nav('week');
}
